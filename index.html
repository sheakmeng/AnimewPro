<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Animew Pro - Telegram Cloud & Dramaora Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg: #090c14;
      --surface: #101524;
      --card-bg: #141b2d;
      --card-hover: #1a233a;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #38bdf8);
      --tg-gradient: linear-gradient(135deg, #0088cc, #00b4d8);
      --orange-gradient: linear-gradient(135deg, #f97316, #ef4444);
      --red-badge: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Kantumruy Pro', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    /* App Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 12, 20, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      text-transform: uppercase;
    }
    .tg-cloud-badge {
      font-size: 9px;
      font-weight: 700;
      background: rgba(0, 136, 204, 0.2);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(0, 136, 204, 0.35);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action-round {
      position: relative;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action-round:active { transform: scale(0.92); }
    .btn-action-round.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    .bell-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 17px;
      height: 17px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--bg);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .search-bar {
      position: relative;
      width: 100%;
    }
    .search-bar input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-bar input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .search-bar input::placeholder { color: #64748b; font-size: 12.5px; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 14px 10px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }
    .tab-btn.tab-tg.active {
      background: #0088cc;
      border-color: #0088cc;
      box-shadow: 0 2px 10px rgba(0, 136, 204, 0.4);
    }
    .tab-btn.tab-recent.active {
      background: #ef4444;
      border-color: #ef4444;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }

    /* Main Container */
    main {
      padding: 6px 10px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 4px 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 7px;
      border-radius: 10px;
    }

    /* Compact 3-Column Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (min-width: 600px) {
      .media-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
      main { padding: 10px 16px 80px; }
    }
    @media (min-width: 900px) {
      .media-grid { grid-template-columns: repeat(6, 1fr); gap: 14px; }
    }

    /* Card */
    .media-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      border: 1px solid var(--border);
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .media-card:active {
      transform: scale(0.96);
      border-color: rgba(99, 102, 241, 0.4);
    }
    .media-card.is-watched {
      border-color: rgba(99, 102, 241, 0.25);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 142%; /* 1:1.42 poster ratio */
      background: #141b2d;
      overflow: hidden;
    }
    .thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .thumb-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      color: #818cf8;
      font-size: 30px;
      padding: 8px;
    }
    .thumb-placeholder-text {
      font-size: 10.5px;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 6px;
      text-align: center;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .overlay-top-left {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 2;
    }
    .overlay-top-right {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      z-index: 2;
    }
    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 6px 6px;
      background: linear-gradient(to top, rgba(9,12,20,0.95) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }

    .badge-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      letter-spacing: 0.2px;
      line-height: 1.2;
    }
    .badge-series { background: rgba(99, 102, 241, 0.88); color: #fff; }
    .badge-movie  { background: rgba(249, 115, 22, 0.88); color: #fff; }
    .badge-tg     { background: rgba(0, 136, 204, 0.92); color: #fff; }
    .badge-hd     { background: rgba(0, 0, 0, 0.65); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-ep-count { background: #ef4444; color: #fff; }
    .badge-watched { background: rgba(16, 185, 129, 0.88); color: #fff; }
    .badge-year { font-size: 10px; font-weight: 600; color: #cbd5e1; }
    .badge-new-tag { background: #10b981; color: #fff; font-size: 8.5px; }

    .card-info {
      padding: 7px 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-grow: 1;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-last-watched {
      font-size: 9.5px;
      font-weight: 500;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }

    /* State & Loader */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      gap: 12px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Video Player Modal */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: max(40px, env(safe-area-inset-bottom, 32px));
    }
    #modal.active { display: flex; }

    .modal-sticky-player {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #000;
      width: 100%;
    }
    .modal-nav {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      z-index: 20;
    }
    .btn-back {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .btn-back:active { transform: scale(0.92); }

    #player {
      width: 100%;
      max-height: 48vh;
      aspect-ratio: 16/9;
      background: #000;
      display: block;
      object-fit: contain;
    }

    .fallback-banner {
      background: linear-gradient(90deg, #1e1b4b, #312e81);
      border-bottom: 1px solid rgba(99, 102, 241, 0.4);
      padding: 7px 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #c7d2fe;
    }
    .fallback-banner.show { display: flex; }
    .btn-switch-server {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Player Controls Bar (Prev, Next, Lock, AutoNext) */
    .player-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 12px;
      background: #0d121f;
      border-bottom: 1px solid var(--border);
    }
    .ctrl-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .ctrl-btn:active { transform: scale(0.94); }
    .ctrl-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #818cf8;
    }
    .ctrl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    .ctrl-btn-lock {
      flex: 0.8;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* Screen Lock Overlay */
    #screen-lock-shield {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.01);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    #screen-lock-shield.locked {
      display: flex;
    }
    .floating-unlock-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(16, 21, 36, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: pulse 2s infinite;
    }
    .floating-unlock-btn:active { transform: scale(0.92); }

    .modal-body {
      padding: 14px 14px 60px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
    }
    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .modal-synopsis {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .modal-synopsis.expanded { -webkit-line-clamp: unset; }
    .synopsis-toggle {
      font-size: 11.5px;
      color: #818cf8;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }

    /* Modal Action Bar */
    .modal-actions-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-tg-stream {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--tg-gradient);
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 136, 204, 0.35);
      transition: transform 0.15s ease;
    }
    .btn-tg-stream:active { transform: scale(0.97); }

    /* Episodes Section */
    .episodes-section {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .episodes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }
    .episodes-pills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
    }
    .ep-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      position: relative;
    }
    .ep-pill:active { transform: scale(0.94); }
    .ep-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }
    .ep-pill.ep-watched:not(.active) {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .ep-pill.is-tg:not(.active) {
      border-color: rgba(0, 136, 204, 0.35);
    }
    .ep-pill.no-video {
      opacity: 0.35;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* Notification Drawer */
    #notif-drawer {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: flex-end;
    }
    #notif-drawer.active { display: flex; }
    .notif-panel {
      width: 85%;
      max-width: 380px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      animation: slideInRight 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 14px 14px;
      border-bottom: 1px solid var(--border);
    }
    .notif-head-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-close-notif {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .notif-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notif-card {
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .notif-card:active { background: rgba(255,255,255,0.06); }
    .notif-thumb {
      width: 44px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      background: #141b2d;
      flex-shrink: 0;
    }
    .notif-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
    }
    .notif-show-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-desc {
      font-size: 11px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .notif-time {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 21, 36, 0.96);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;

let allItems = [];
let showEpisodeStats = {};
let recentUpdatesList = [];
let backupManifest = {};
let currentFilter = "all";
let currentEpisodes = [];
let currentShowObj = null;
let currentEpIdx = -1;
let hasTriedFallback = false;

// Watch history persistence
function getWatchedHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_WATCHED_KEY) || "{}"); } catch { return {}; }
}
function getWatchedEpisodes() {
  try { return JSON.parse(localStorage.getItem(STORAGE_EPS_KEY) || "{}"); } catch { return {}; }
}

function markEpisodeWatched(showId, epNum, epTitle) {
  try {
    const history = getWatchedHistory();
    history[showId] = { lastEp: epNum, lastTitle: epTitle, timestamp: Date.now() };
    localStorage.setItem(STORAGE_WATCHED_KEY, JSON.stringify(history));

    const epMap = getWatchedEpisodes();
    epMap[showId + "_" + epNum] = true;
    localStorage.setItem(STORAGE_EPS_KEY, JSON.stringify(epMap));

    applyFilter();
  } catch (e) {
    console.warn("Storage save error", e);
  }
}

async function fetchAPI(endpoint) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 800);
    const r = await fetch(`${SB_URL}/rest/v1/${endpoint}`, { headers: HEADERS, signal: controller.signal });
    clearTimeout(timeoutId);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

async function loadManifestData() {
  if (typeof EMBEDDED_MANIFEST === "object" && EMBEDDED_MANIFEST) {
    backupManifest = Object.assign({}, EMBEDDED_MANIFEST);
  }
  try {
    const cached = localStorage.getItem(STORAGE_MANIFEST_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (typeof parsed === "object" && parsed) {
        backupManifest = Object.assign(backupManifest, parsed);
      }
    }
  } catch (e) {}

  try {
    const localRes = await fetch("./backup_manifest.json");
    if (localRes.ok) {
      const data = await localRes.json();
      if (typeof data === "object" && data) {
        backupManifest = Object.assign(backupManifest, data);
      }
    }
  } catch (e) {}

  // 🌐 Live Sync latest Backed-Up Dramas & Episodes from GitHub Cloud
  try {
    const ghRes = await fetch(GITHUB_MANIFEST_URL + "?_t=" + Date.now(), { cache: "no-store" });
    if (ghRes.ok) {
      const ghData = await ghRes.json();
      if (typeof ghData === "object" && ghData && Object.keys(ghData).length > 0) {
        backupManifest = Object.assign(backupManifest, ghData);
        localStorage.setItem(STORAGE_MANIFEST_KEY, JSON.stringify(backupManifest));
        console.log(`🌐 Live synced ${Object.keys(ghData).length} backed-up episodes from GitHub!`);
      }
    }
  } catch (e) {
    console.warn("ℹ️ Offline or could not sync GitHub manifest:", e);
  }

  return backupManifest;
}

function timeAgo(dateStr) {
  if (!dateStr) return "";
  const now = new Date();
  const past = new Date(dateStr);
  const diffMs = now - past;
  const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
  const diffDays = Math.floor(diffHours / 24);

  if (diffHours < 1) return "ទើបបញ្ចូល (Just now)";
  if (diffHours < 24) return `${diffHours} ម៉ោងមុន`;
  if (diffDays === 1) return "ម្សិលមិញ (Yesterday)";
  if (diffDays < 7) return `${diffDays} ថ្ងៃមុន`;
  return past.toLocaleDateString('km-KH', { month: 'short', day: 'numeric' });
}

async function init(silent = false) {
  try {
    if (!silent) {
      document.getElementById("loader").style.display = "flex";
      document.getElementById("content").style.display = "none";
    }

    await loadManifestData();
    const manifestCount = Object.keys(backupManifest).length;
    console.log(`📦 Loaded ${manifestCount} Telegram Cloud Backed Up episodes`);

    // 1. Fetch Supabase shows (if available)
    const sbShows = await fetchAPI("shows?select=id,title,synopsis,poster_url,banner_url,release_year,status,type,featured,is_free,created_at&order=featured.desc,created_at.desc&limit=300");
    const showMap = {};

    if (sbShows && Array.isArray(sbShows)) {
      sbShows.forEach(s => { showMap[s.id] = s; });
    }

    // 2. Synthesize shows from backupManifest with Poster Thumbnails
    Object.entries(backupManifest).forEach(([epId, item]) => {
      const showId = item.show_id || ("show_" + (item.show_title || "Unknown"));
      const isDramaora = item.source === "dramaora" || String(showId).includes("dramaora");
      const resolvedPoster = item.poster_url || KNOWN_POSTERS[showId] || KNOWN_POSTERS[item.show_title] || "";
      
      if (!showMap[showId]) {
        showMap[showId] = {
          id: showId,
          title: item.show_title || "Unknown Show",
          synopsis: item.synopsis || `រឿង "${item.show_title}" បានរក្សាទុកក្នុង Telegram Cloud Archive រួចរាល់។ អ្នកអាចទស្សនា ឬទាញយកផ្ទាល់បានភ្លាមៗ។`,
          poster_url: resolvedPoster,
          banner_url: resolvedPoster,
          release_year: 2026,
          status: "completed",
          type: isDramaora ? "dramaora" : "series",
          featured: true,
          is_free: true,
          is_telegram_backup: true,
          source: item.source || "telegram",
          created_at: item.backed_up_at || new Date().toISOString()
        };
      } else {
        showMap[showId].is_telegram_backup = true;
        if (!showMap[showId].poster_url && resolvedPoster) {
          showMap[showId].poster_url = resolvedPoster;
        }
        if (!showMap[showId].synopsis && item.synopsis) {
          showMap[showId].synopsis = item.synopsis;
        }
      }
    });

    allItems = Object.values(showMap);

    // Sort: Dramas with posters and recent updates first
    allItems.sort((a, b) => {
      if (a.is_telegram_backup && !b.is_telegram_backup) return -1;
      if (!a.is_telegram_backup && b.is_telegram_backup) return 1;
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });

    // 3. Process Episode Stats & Updates
    const sbEps = await fetchAPI("episodes?select=id,show_id,title,episode_number,created_at,video_url&video_url=not.is.null&order=created_at.desc&limit=600");
    const allEpsList = (sbEps && Array.isArray(sbEps)) ? [...sbEps] : [];

    // Add manifest episodes
    Object.entries(backupManifest).forEach(([epId, item]) => {
      const showId = item.show_id || ("show_" + (item.show_title || "Unknown"));
      allEpsList.push({
        id: epId,
        show_id: showId,
        title: item.show_title ? `${item.show_title} ភាគ ${item.episode_number}` : `ភាគ ${item.episode_number}`,
        episode_number: item.episode_number || 1,
        created_at: item.backed_up_at || new Date().toISOString(),
        video_url: item.original_url || "",
        poster_url: item.poster_url || "",
        telegram_message_id: item.telegram_message_id,
        file_size_mb: item.file_size_mb,
        source: item.source || "telegram"
      });
    });

    const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    showEpisodeStats = {};

    allEpsList.forEach(ep => {
      if (!showEpisodeStats[ep.show_id]) {
        showEpisodeStats[ep.show_id] = { maxEp: ep.episode_number || 1, count: 0, newEpsCount: 0, latestEpDate: ep.created_at };
      }
      const st = showEpisodeStats[ep.show_id];
      st.count += 1;
      if (ep.episode_number > st.maxEp) st.maxEp = ep.episode_number;
      if (new Date(ep.created_at) > sevenDaysAgo) st.newEpsCount += 1;
    });

    // Recent Updates List for Notification Drawer
    const seenUpdates = new Set();
    recentUpdatesList = [];
    allEpsList.slice(0, 40).forEach(ep => {
      const show = showMap[ep.show_id];
      if (show && !seenUpdates.has(ep.show_id + "_" + ep.episode_number)) {
        seenUpdates.add(ep.show_id + "_" + ep.episode_number);
        recentUpdatesList.push({
          show: show,
          episode_number: ep.episode_number,
          title: ep.title,
          created_at: ep.created_at
        });
      }
    });

    const notifCountBadge = document.getElementById("notif-count");
    if (recentUpdatesList.length > 0) {
      notifCountBadge.textContent = Math.min(recentUpdatesList.length, 99);
      notifCountBadge.style.display = "flex";
    }

    document.getElementById("loader").style.display = "none";
    document.getElementById("content").style.display = "block";
    applyFilter();

  } catch (err) {
    console.error("Init error:", err);
    document.getElementById("loader").innerHTML = `<div style="font-size:24px;">⚠️</div><div style="margin-top:8px;">មិនអាចផ្ទុកទិន្នន័យបាន: ${err.message}</div>`;
  }
}

function renderGrid(items) {
  const grid = document.getElementById("grid");

  if (items.length === 0) {

    return;
  }
  document.getElementById("empty-state").style.display = "none";

  const watchedHistory = getWatchedHistory();
  const fragment = document.createDocumentFragment();

  items.forEach(show => {
    const card = document.createElement("div");
    const watchedInfo = watchedHistory[show.id];
    const isWatched = !!watchedInfo;

    card.className = `media-card ${isWatched ? 'is-watched' : ''}`;
    
    const isMovie = show.type === "movie";
    const isDramaora = show.type === "dramaora" || show.source === "dramaora";
    const typeLabel = isDramaora ? "Dramaora" : (isMovie ? "Movie" : "Series");
    const typeClass = isDramaora ? "badge-tg" : (isMovie ? "badge-movie" : "badge-series");
    
    const stats = showEpisodeStats[show.id];
    let epBadgeHtml = "";
    if (isMovie) {
      epBadgeHtml = `<span class="badge-chip badge-hd">FULL</span>`;
    } else if (stats) {
      if (stats.newEpsCount > 1) {
        epBadgeHtml = `<span class="badge-chip badge-ep-count">+x${stats.newEpsCount}</span><span class="badge-chip badge-hd">x${stats.maxEp}</span>`;
      } else {
        epBadgeHtml = `<span class="badge-chip badge-ep-count">x${stats.maxEp || stats.count}</span>`;
      }
    }

    let watchedBadgeHtml = "";
    let lastWatchedSub = "";
    if (isWatched) {
      watchedBadgeHtml = `<span class="badge-chip badge-watched">✓ មើលរួច</span>`;
      if (!isMovie && watchedInfo.lastEp) {
        lastWatchedSub = `<div class="card-last-watched"><span>👁️</span><span>ដល់ភាគ x${watchedInfo.lastEp}</span></div>`;
      } else if (isMovie) {
        lastWatchedSub = `<div class="card-last-watched"><span>👁️</span><span>បានទស្សនា</span></div>`;
      }
    }

    let tgCloudBadge = "";
    if (show.is_telegram_backup) {
      tgCloudBadge = `<span class="badge-chip badge-tg">✈️ TG Cloud</span>`;
    }

    const resolvedPoster = show.poster_url || KNOWN_POSTERS[show.id] || KNOWN_POSTERS[show.title] || "";

    card.innerHTML = `
      <div class="thumb-wrap">
        ${resolvedPoster 
          ? `<img class="thumb-img" src="${resolvedPoster}" loading="eager" alt="${show.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` 
          : ''}
        <div class="thumb-placeholder" style="${resolvedPoster ? 'display:none' : 'display:flex'}">
          <span>🎬</span>
          <span class="thumb-placeholder-text">${show.title}</span>
        </div>
        <div class="overlay-top-left">
          <span class="badge-chip ${typeClass}">${typeLabel}</span>
          ${tgCloudBadge}
          ${watchedBadgeHtml}
        </div>
        <div class="overlay-top-right">
          ${epBadgeHtml}
        </div>
        <div class="overlay-bottom">
          <span class="badge-year">${show.release_year || '2026'}</span>
          ${show.status === 'ongoing' ? '<span class="badge-chip badge-new-tag">ONGOING</span>' : ''}
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${show.title}</div>
        ${lastWatchedSub}
      </div>
    `;

    card.addEventListener("click", () => openModal(show));
    fragment.appendChild(card);
  });

  grid.appendChild(fragment);
}

function applyFilter() {
  const searchVal = document.getElementById("search-input").value.trim().toLowerCase();
  let list = allItems;

  const sectionLabel = document.getElementById("section-label");
  const sectionIcon = document.getElementById("section-icon");

  if (currentFilter === "telegram") {
    list = list.filter(s => !!s.is_telegram_backup);
    sectionLabel.textContent = "រឿងក្នុង Telegram Archive";
    sectionIcon.textContent = "✈️";
  } else if (currentFilter === "dramaora") {
    list = list.filter(s => s.type === "dramaora" || s.source === "dramaora");
    sectionLabel.textContent = "រឿង Dramaora.tv (Unlocked)";
    sectionIcon.textContent = "🎬";
  } else if (currentFilter === "recent") {
    const watchedHistory = getWatchedHistory();
    list = list.filter(s => !!watchedHistory[s.id]);
    list.sort((a, b) => (watchedHistory[b.id]?.timestamp || 0) - (watchedHistory[a.id]?.timestamp || 0));
    sectionLabel.textContent = "ភាពយន្តទើបមើល (Recent Watched)";
    sectionIcon.textContent = "🕒";
  } else if (currentFilter === "movie") {
    list = list.filter(s => s.type === "movie");
    sectionLabel.textContent = "ភាពយន្តទោល (Movies)";
    sectionIcon.textContent = "🎬";
  } else if (currentFilter === "series") {
    list = list.filter(s => s.type !== "movie" && s.type !== "dramaora");
    sectionLabel.textContent = "ភាពយន្តភាគ (Series)";
    sectionIcon.textContent = "📺";
  } else if (currentFilter === "featured") {
    list = list.filter(s => s.featured);
    sectionLabel.textContent = "ភាពយន្តពេញនិយម (Featured)";
    sectionIcon.textContent = "⭐";
  } else {
    sectionLabel.textContent = "ភាពយន្តទាំងអស់";
    sectionIcon.textContent = "🎬";
  }

  if (searchVal) {
    list = list.filter(s => s.title.toLowerCase().includes(searchVal));
  }

  renderGrid(list);
}

async function openModal(show) {
  currentShowObj = show;
  const modal = document.getElementById("modal");
  if (!modal) return;
  modal.classList.add("active");
  document.body.style.overflow = "hidden";
  if (fallbackBanner) fallbackBanner.classList.remove("show");

  if (playerEl) {
    playerEl.src = "";
    playerEl.poster = show.banner_url || show.poster_url || "";
  }

  const titleEl = document.getElementById("m-title");
  if (titleEl) titleEl.textContent = show.title || "ភាពយន្ត";
  
  const synEl = document.getElementById("m-synopsis");
  if (synEl) synEl.textContent = show.synopsis || "គ្មានព័ត៌មានសង្ខេប / No synopsis.";
  
  const isMovie = show.type === "movie";
  const isDramaora = show.type === "dramaora" || show.source === "dramaora";
  const metaEl = document.getElementById("m-meta");
  if (metaEl) {
    metaEl.innerHTML = `
      <span class="badge-chip ${isDramaora ? 'badge-tg' : (isMovie ? 'badge-movie' : 'badge-series')}">${isDramaora ? 'Dramaora (Unlocked)' : (isMovie ? 'ភាពយន្តទោល (Movie)' : 'ភាពយន្តភាគ (Series)')}</span>
      ${show.release_year ? `<span class="badge-chip" style="background:rgba(255,255,255,0.08);color:#cbd5e1;">${show.release_year}</span>` : ''}
      <span class="badge-chip badge-hd">1080p FHD</span>
      ${show.is_telegram_backup ? '<span class="badge-chip badge-tg">✈️ Telegram Cloud Ready</span>' : ''}
    `;
  }

  const synBox = document.getElementById("m-synopsis");
  if (synBox) synBox.classList.remove("expanded");
  const synBtn = document.getElementById("m-synopsis-toggle");
  if (synBtn) {
    synBtn.textContent = "អានបន្ថែម ›";
    synBtn.onclick = () => {
      if (!synBox) return;
      synBox.classList.toggle("expanded");
      synBtn.textContent = synBox.classList.contains("expanded") ? "បង្រួមមកវិញ ‹" : "អានបន្ថែម ›";
    };
  }

  const epGrid = document.getElementById("m-episodes-grid");
  if (epGrid) {
    epGrid.innerHTML = `<div class="state-box" style="grid-column:1/-1;padding:20px 0;"><div class="spinner"></div><span>កំពុងទាញភាគ...</span></div>`;
  }

  try {
    // 1. Fetch from Supabase with fast timeout
    let episodes = await fetchAPI(`episodes?select=id,title,episode_number,video_url,duration,season&show_id=eq.${show.id}&order=season.asc,episode_number.asc&limit=500`);
    if (!episodes || !Array.isArray(episodes)) episodes = [];

    // 2. Fetch/Merge from backupManifest
    const manifestEps = [];
    Object.entries(backupManifest).forEach(([epId, item]) => {
      const matchShowId = (item.show_id && item.show_id === show.id) || 
                          (item.show_title && item.show_title === show.title) ||
                          ("show_" + (item.show_title || "")) === show.id ||
                          ("dramaora_" + (item.show_id || "")) === show.id ||
                          String(item.show_id).replace("dramaora_", "") === String(show.id).replace("dramaora_", "");
      if (matchShowId) {
        manifestEps.push({
          id: epId,
          show_id: show.id,
          title: item.show_title ? `${item.show_title} ភាគ ${item.episode_number}` : `ភាគ ${item.episode_number}`,
          episode_number: parseInt(item.episode_number, 10) || 1,
          video_url: item.original_url || "",
          telegram_message_id: item.telegram_message_id,
          telegram_message_ids: item.telegram_message_ids,
          file_size_mb: item.file_size_mb,
          source: item.source || "telegram"
        });
      }
    });

    // Merge episodes uniquely
    const epMap = {};
    episodes.forEach(e => { epMap[e.episode_number || e.id] = e; });
    manifestEps.forEach(e => {
      const num = e.episode_number || e.id;
      if (!epMap[num]) {
        epMap[num] = e;
      } else {
        epMap[num].telegram_message_id = e.telegram_message_id;
        epMap[num].telegram_message_ids = e.telegram_message_ids;
        epMap[num].file_size_mb = e.file_size_mb;
        if (!epMap[num].video_url && e.video_url) {
          epMap[num].video_url = e.video_url;
        }
      }
    });

    currentEpisodes = Object.values(epMap).sort((a, b) => (a.episode_number || 1) - (b.episode_number || 1));
    document.getElementById("m-ep-count").textContent = currentEpisodes.length;

    if (currentEpisodes.length === 0) {
      epGrid.innerHTML = `<div class="state-box" style="grid-column:1/-1;padding:20px 0;">មិនទាន់មានភាគសម្រាប់ទស្សនានៅឡើយទេ</div>`;
      return;
    }

    const watchedEpMap = getWatchedEpisodes();
    const watchedHistory = getWatchedHistory();
    const lastWatchedEpNum = watchedHistory[show.id]?.lastEp;

    epGrid.innerHTML = "";
    currentEpisodes.forEach((ep, idx) => {
      const btn = document.createElement("button");
      const hasUrl = !!ep.video_url || !!ep.telegram_message_id;
      const epNum = ep.episode_number || (idx + 1);
      const isEpWatched = !!watchedEpMap[show.id + "_" + epNum];
      const isBackedUp = !!ep.telegram_message_id || !!backupManifest[ep.id];

      btn.className = `ep-pill ${hasUrl ? '' : 'no-video'} ${isEpWatched ? 'ep-watched' : ''} ${isBackedUp ? 'is-tg' : ''}`;
      btn.textContent = isMovie ? "ទស្សនា (Play)" : (isEpWatched ? `x${epNum} ✓` : `x${epNum}`);
      if (isBackedUp) {
        btn.title = "⚡ Telegram Cloud Backup Ready";
      }
      btn.dataset.idx = idx;

      if (hasUrl) {
        btn.addEventListener("click", () => playEpisode(idx));
      }
      epGrid.appendChild(btn);
    });

    let targetIdx = -1;
    if (lastWatchedEpNum) {
      targetIdx = currentEpisodes.findIndex(e => e.episode_number === lastWatchedEpNum && (!!e.video_url || !!e.telegram_message_id));
    }
    if (targetIdx === -1) {
      targetIdx = currentEpisodes.findIndex(e => !!e.video_url || !!e.telegram_message_id);
    }
    if (targetIdx !== -1) {
      playEpisode(targetIdx);
    }
  } catch (e) {
    console.error("Load episodes error:", e);
    epGrid.innerHTML = `<div style="grid-column:1/-1;color:#f87171;font-size:12px;text-align:center;">មិនអាចផ្ទុកភាគបាន</div>`;
  }
}

function playEpisode(idx) {
  currentEpIdx = idx;
  hasTriedFallback = false;
  fallbackBanner.classList.remove("show");

  const ep = currentEpisodes[idx];
  if (!ep) return;

  if (ep.video_url) {
    playerEl.src = ep.video_url;
    playerEl.play().catch(() => {});
  }

  const epNum = ep.episode_number || (idx + 1);

  if (currentShowObj) {
    markEpisodeWatched(currentShowObj.id, epNum, ep.title);
  }

  // Dynamic Telegram Action Buttons (Single or Multi-Part)
  const actionsBar = document.getElementById("m-actions-bar");
  if (actionsBar) {
    actionsBar.innerHTML = "";
    const backupItem = backupManifest[ep.id] || ep;
    
    if (backupItem && backupItem.telegram_message_id) {
      const cleanChanId = "3943277744"; // Telegram Channel (-1003943277744)
      const msgIds = backupItem.telegram_message_ids || [backupItem.telegram_message_id];

      msgIds.forEach((msgId, pIdx) => {
        const tgWebLink = `https://t.me/c/${cleanChanId}/${msgId}`;
        const btn = document.createElement("a");
        btn.className = "btn-tg-stream";
        btn.href = tgWebLink;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";

        const sizeLabel = backupItem.file_size_mb ? ` (${backupItem.file_size_mb} MB)` : "";
        const partLabel = msgIds.length > 1 
          ? `✈️ ទស្សនា Part ${pIdx + 1}/${msgIds.length} លើ Telegram${sizeLabel}`
          : `✈️ ទស្សនា / Download លើ Telegram Cloud${sizeLabel}`;

        btn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.05-.49-.83-.27-1.49-.42-1.43-.88.03-.24.38-.49 1.03-.75 4.04-1.76 6.74-2.92 8.09-3.5 3.85-1.65 4.65-1.94 5.18-1.95.12 0 .37.03.54.17.14.12.18.28.2.45-.01.07.01.23 0 .28z"/></svg>
          <span>${partLabel}</span>
        `;

        btn.addEventListener("click", function(e) {
          if (window.Capacitor || window.location.protocol === "file:" || navigator.userAgent.includes("wv")) {
            e.preventDefault();
            window.open(tgWebLink, "_system");
          }
        });

        actionsBar.appendChild(btn);
      });
    }
  }

  document.querySelectorAll(".ep-pill").forEach(p => p.classList.remove("active"));
  const activeBtn = document.querySelector(`.ep-pill[data-idx="${idx}"]`);
  if (activeBtn) {
    activeBtn.classList.add("active");
    activeBtn.classList.add("ep-watched");
    if (currentShowObj?.type !== "movie") {
      activeBtn.textContent = `x${epNum} ✓`;
    }
  }

  // Update Previous / Next button states
  const prevEpBtn = document.getElementById("btn-prev-ep");
  const nextEpBtn = document.getElementById("btn-next-ep");
  if (prevEpBtn) {
    prevEpBtn.disabled = idx <= 0;
  }
  if (nextEpBtn) {
    nextEpBtn.disabled = idx >= currentEpisodes.length - 1;
  }

  showToast(`▶ កំពុងចាក់: ${ep.title || 'ភាគ ' + epNum}`);
}

// Player Controls & Auto Next Logic
let isAutoNextEnabled = true;
let isScreenLocked = false;
let autoNextCountdownTimer = null;

const prevEpBtn = document.getElementById("btn-prev-ep");
const nextEpBtn = document.getElementById("btn-next-ep");
const autoNextBtn = document.getElementById("btn-toggle-autonext");
const autoNextLabel = document.getElementById("label-autonext");
const lockScreenBtn = document.getElementById("btn-lock-screen");
const lockShield = document.getElementById("screen-lock-shield");
const floatingUnlockBtn = document.getElementById("btn-floating-unlock");

// Auto Next Toggle
if (autoNextBtn) {
  autoNextBtn.addEventListener("click", () => {
    isAutoNextEnabled = !isAutoNextEnabled;
    if (isAutoNextEnabled) {
      autoNextBtn.classList.add("active");
      autoNextLabel.textContent = "Auto Next: ON";
      showToast("⚡ បានបើក Auto Next Episode (ON)");
    } else {
      autoNextBtn.classList.remove("active");
      autoNextLabel.textContent = "Auto Next: OFF";
      showToast("⏸️ បានបិទ Auto Next Episode (OFF)");
    }
  });
}

// Previous & Next Episode Navigation
if (prevEpBtn) {
  prevEpBtn.addEventListener("click", () => {
    if (currentEpIdx > 0) {
      playEpisode(currentEpIdx - 1);
    }
  });
}

if (nextEpBtn) {
  nextEpBtn.addEventListener("click", () => {
    if (currentEpIdx >= 0 && currentEpIdx + 1 < currentEpisodes.length) {
      playEpisode(currentEpIdx + 1);
    }
  });
}

// Screen Lock & Unlock
function lockPlayerScreen() {
  isScreenLocked = true;
  if (lockShield) lockShield.classList.add("locked");
  showToast("🔒 បានចាក់សោរអេក្រង់ (Locked) — មិនអាចចុចប៉ះខុសបានទេ");
}

function unlockPlayerScreen() {
  isScreenLocked = false;
  if (lockShield) lockShield.classList.remove("locked");
  showToast("🔓 បានដោះសោរអេក្រង់ (Unlocked)");
}

if (lockScreenBtn) lockScreenBtn.addEventListener("click", lockPlayerScreen);
if (floatingUnlockBtn) floatingUnlockBtn.addEventListener("click", unlockPlayerScreen);

// Video Ended -> Auto Next Episode
playerEl.addEventListener("ended", () => {
  if (!isAutoNextEnabled) return;
  if (currentEpIdx >= 0 && currentEpIdx + 1 < currentEpisodes.length) {
    const nextIdx = currentEpIdx + 1;
    const nextEp = currentEpisodes[nextIdx];
    const nextNum = nextEp ? (nextEp.episode_number || (nextIdx + 1)) : (nextIdx + 1);

    showToast(`🎬 ចប់ភាគ! កំពុងប្តូរទៅភាគ x${nextNum} ក្នុង 3 វិនាទី...`);
    clearTimeout(autoNextCountdownTimer);
    autoNextCountdownTimer = setTimeout(() => {
      playEpisode(nextIdx);
    }, 2800);
  } else {
    showToast("🎉 បានទស្សនាចប់គ្រប់ភាគនៃរឿងនេះហើយ!");
  }
});

function closeModal() {
  const modal = document.getElementById("modal");
  if (modal) modal.classList.remove("active");
  document.body.style.overflow = "";
  if (playerEl) {
    playerEl.pause();
    playerEl.src = "";
  }
  unlockPlayerScreen();
  clearTimeout(autoNextCountdownTimer);
  if (fallbackBanner) fallbackBanner.classList.remove("show");
  const actionsBar = document.getElementById("m-actions-bar");
  if (actionsBar) actionsBar.innerHTML = "";
}

document.getElementById("btn-close").addEventListener("click", closeModal);

// Auto-refresh when app becomes visible or every 20s
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) init(true);
});

// Start
init();
</script>
