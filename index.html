<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Animew Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg: #090c14;
      --surface: #101524;
      --card-bg: #141b2d;
      --card-hover: #1a233a;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #38bdf8);
      --orange-gradient: linear-gradient(135deg, #f97316, #ef4444);
      --red-badge: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Kantumruy Pro', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    /* App Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 12, 20, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-bell {
      position: relative;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-bell:active { transform: scale(0.92); }
    .bell-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 17px;
      height: 17px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--bg);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .search-bar {
      position: relative;
      width: 100%;
    }
    .search-bar input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-bar input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .search-bar input::placeholder { color: #64748b; font-size: 12.5px; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 14px 10px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }
    .tab-btn.tab-recent.active {
      background: #ef4444;
      border-color: #ef4444;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }

    /* Main Container */
    main {
      padding: 6px 10px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 4px 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 7px;
      border-radius: 10px;
    }

    /* Compact 3-Column Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (min-width: 600px) {
      .media-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
      main { padding: 10px 16px 80px; }
    }
    @media (min-width: 900px) {
      .media-grid { grid-template-columns: repeat(6, 1fr); gap: 14px; }
    }

    /* Card */
    .media-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .media-card:active {
      transform: scale(0.96);
    }
    .media-card.is-watched {
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.12);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: #182033;
      overflow: hidden;
    }
    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .media-card:hover .thumb-img {
      transform: scale(1.04);
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, #182033, #0f1422);
      color: rgba(255,255,255,0.2);
    }

    /* Overlay Badges on Thumbnail */
    .overlay-top-left {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 2;
    }
    .overlay-top-right {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-end;
    }
    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 5px 4px;
      background: linear-gradient(to top, rgba(9, 12, 20, 0.95), transparent);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 2;
    }

    .badge-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1.1;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .badge-movie {
      background: rgba(14, 165, 233, 0.85);
      color: #fff;
    }
    .badge-series {
      background: rgba(99, 102, 241, 0.85);
      color: #fff;
    }
    
    .badge-watched {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.5);
    }

    .badge-ep-count {
      background: var(--orange-gradient);
      color: #fff;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .badge-new-tag {
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
      font-size: 8px;
    }

    .badge-year {
      font-size: 9px;
      color: #cbd5e1;
      font-weight: 600;
    }

    .card-info {
      padding: 6px 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.35;
      color: #f1f5f9;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 31px;
    }

    .card-last-watched {
      font-size: 9.5px;
      color: #f87171;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Notification Drawer */
    #notif-drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #notif-drawer.active { display: flex; justify-content: flex-end; }

    .notif-panel {
      width: 100%;
      max-width: 360px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      animation: slideLeft 0.25s ease-out;
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .notif-head {
      padding: max(16px, env(safe-area-inset-top)) 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 12, 20, 0.95);
    }
    .notif-head-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-close-notif {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .notif-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 30px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notif-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .notif-card:active {
      background: var(--card-hover);
      transform: scale(0.98);
    }
    .notif-thumb {
      width: 44px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      background: #182033;
      flex-shrink: 0;
    }
    .notif-info { flex: 1; min-width: 0; }
    .notif-show-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .notif-desc {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .notif-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Modal / Video Player */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #06080e;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #modal.active { display: block; }

    .modal-sticky-player {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #000;
      width: 100%;
      aspect-ratio: 16/9;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      position: relative;
    }
    .modal-sticky-player video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    /* Fallback Alert Banner overlay */
    .fallback-banner {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      animation: fadeIn 0.3s ease;
    }
    .fallback-banner.show { display: flex; }
    .btn-switch-server {
      background: #fff;
      color: #000;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-nav {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      z-index: 20;
    }
    .btn-back {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .modal-body {
      padding: 14px 14px 60px;
      max-width: 900px;
      margin: 0 auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .modal-synopsis {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 16px;
      max-height: 68px;
      overflow: hidden;
      position: relative;
    }
    .modal-synopsis.expanded { max-height: none; }
    .synopsis-toggle {
      font-size: 11.5px;
      color: #818cf8;
      font-weight: 600;
      margin-top: 4px;
      display: inline-block;
      cursor: pointer;
    }

    .modal-actions-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 6px;
      flex-wrap: wrap;
    }
    .btn-tg-stream {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #229ED9, #0088cc);
      color: #fff;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 136, 204, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.16s ease;
      cursor: pointer;
    }
    .btn-tg-stream:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0, 136, 204, 0.5);
    }
    .btn-tg-stream:active { transform: scale(0.96); }

    /* Episode Selector */
    .episodes-section {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .episodes-header {
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .episodes-pills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
    }
    .ep-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .ep-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }
    .ep-pill.ep-watched:not(.active) {
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }
    .ep-pill.no-video {
      opacity: 0.35;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* State / Spinner */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 21, 36, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease;
      z-index: 2000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="nav-top">
    <div class="brand">
      <span class="brand-logo">Animew</span>
      <span class="brand-badge">PRO</span>
    </div>
    <div class="header-actions">
      <button class="btn-bell" id="btn-notif" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bell-badge" id="notif-count" style="display:none;">0</span>
      </button>
    </div>
  </div>
  <div class="search-bar">
    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search-input" type="text" placeholder="ស្វែងរកភាពយន្ត / Search..." />
  </div>
</header>

<div class="filter-tabs">
  <button class="tab-btn active" data-filter="all">ទាំងអស់</button>
  <button class="tab-btn tab-recent" data-filter="recent">🕒 ទើបមើល (Recent)</button>
  <button class="tab-btn" data-filter="movie">រឿងទោល (Movies)</button>
  <button class="tab-btn" data-filter="series">រឿងភាគ (Series)</button>
  <button class="tab-btn" data-filter="featured">ពេញនិយម (Featured)</button>
</div>

<main>
  <div id="loader" class="state-box">
    <div class="spinner"></div>
    <div style="font-size:12px;">កំពុងផ្ទុកទិន្នន័យ...</div>
  </div>

  <div id="content" style="display:none;">
    <div class="section-head">
      <span class="section-title">
        <span id="section-icon">🎬</span>
        <span id="section-label">ភាពយន្តទាំងអស់</span>
      </span>
      <span class="section-badge" id="item-count">0</span>
    </div>
    <div class="media-grid" id="grid"></div>
  </div>

  <div id="empty-state" class="state-box" style="display:none;">
    <div style="font-size:32px; margin-bottom:8px;">🔍</div>
    <div id="empty-msg" style="font-size:13px;">រកមិនឃើញភាពយន្តទេ</div>
  </div>
</main>

<!-- Notification Drawer -->
<div id="notif-drawer">
  <div class="notif-panel">
    <div class="notif-head">

<script>
const SB_URL = "https://dowjxhkijtlsdvhyuddt.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd2p4aGtpanRsc2R2aHl1ZGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjE3MTIsImV4cCI6MjEwMTc5NzcxMn0.ulxBnNG6fc6muqPrAxzEGw0VPyZpR5ug8bY713PyWGg";
const HEADERS = { "apikey": ANON, "Authorization": "Bearer " + ANON };

const STORAGE_WATCHED_KEY = "animew_watched_shows";
const STORAGE_EPS_KEY = "animew_watched_episodes";

let allItems = [];
let showEpisodeStats = {};
let recentUpdatesList = [];
let backupManifest = {}; // { [epId]: { telegram_message_id, file_size_mb } }
let currentFilter = "all";
let currentEpisodes = [];
let currentShowObj = null;
let currentEpIdx = -1;
let hasTriedFallback = false;

// Watch history persistence
function getWatchedHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_WATCHED_KEY) || "{}");
  } catch { return {}; }
}

function getWatchedEpisodes() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_EPS_KEY) || "{}");
  } catch { return {}; }
}

function markEpisodeWatched(showId, epNum, epTitle) {
  try {
    const history = getWatchedHistory();
    history[showId] = {
      lastEp: epNum,
      lastTitle: epTitle,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_WATCHED_KEY, JSON.stringify(history));

    const epMap = getWatchedEpisodes();
    epMap[showId + "_" + epNum] = true;
    localStorage.setItem(STORAGE_EPS_KEY, JSON.stringify(epMap));

    applyFilter();
  } catch (e) {
    console.warn("Storage save error", e);
  }
}

async function fetchAPI(endpoint) {
  const r = await fetch(`${SB_URL}/rest/v1/${endpoint}`, { headers: HEADERS });
  if (!r.ok) throw new Error("Network error: " + r.status);
  return r.json();
}

function timeAgo(dateStr) {
  if (!dateStr) return "";
  const now = new Date();
  const past = new Date(dateStr);
  const diffMs = now - past;
  const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
  const diffDays = Math.floor(diffHours / 24);

  if (diffHours < 1) return "ទើបតែបញ្ចូល (Just now)";
  if (diffHours < 24) return `${diffHours} ម៉ោងមុន`;
  if (diffDays === 1) return "ម្សិលមិញ (Yesterday)";
  if (diffDays < 7) return `${diffDays} ថ្ងៃមុន`;
  return past.toLocaleDateString('km-KH', { month: 'short', day: 'numeric' });
}

async function init() {
  try {
    // 1. Fetch shows
    allItems = await fetchAPI("shows?select=id,title,synopsis,poster_url,banner_url,release_year,status,type,featured,is_free,created_at&order=featured.desc,created_at.desc&limit=300");

    // Load Backup Manifest (if available)
    try {
      const mfRes = await fetch('./backup_manifest.json?t=' + Date.now());
      if (mfRes.ok) {
        backupManifest = await mfRes.json();
        console.log(`📦 Loaded ${Object.keys(backupManifest).length} backed up episodes from Telegram Archive`);
      }
    } catch (e) {
      console.log("No local backup manifest found:", e);
    }

    // 2. Fetch episodes overview
    try {
      const recentEps = await fetchAPI("episodes?select=id,show_id,title,episode_number,created_at,video_url&video_url=not.is.null&order=created_at.desc&limit=600");
      
      const showMap = {};
      allItems.forEach(s => { showMap[s.id] = s; });

      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

      recentEps.forEach(ep => {
        if (!showEpisodeStats[ep.show_id]) {
          showEpisodeStats[ep.show_id] = { maxEp: ep.episode_number || 1, count: 0, newEpsCount: 0, latestEpDate: ep.created_at };
        }
        const st = showEpisodeStats[ep.show_id];
        st.count += 1;
        if (ep.episode_number > st.maxEp) {
          st.maxEp = ep.episode_number;
        }
        if (new Date(ep.created_at) > sevenDaysAgo) {
          st.newEpsCount += 1;
        }
      });

      // Notification updates
      const seenShowUpdates = new Set();
      recentUpdatesList = [];

      recentEps.slice(0, 30).forEach(ep => {
        const show = showMap[ep.show_id];
        if (show && !seenShowUpdates.has(ep.show_id + "_" + ep.episode_number)) {
          seenShowUpdates.add(ep.show_id + "_" + ep.episode_number);
          recentUpdatesList.push({
            show: show,
            episode_number: ep.episode_number,
            title: ep.title,
            created_at: ep.created_at
          });
        }
      });

      const notifCountBadge = document.getElementById("notif-count");
      if (recentUpdatesList.length > 0) {
        notifCountBadge.textContent = Math.min(recentUpdatesList.length, 99);
        notifCountBadge.style.display = "flex";
      }

    } catch (e) {
      console.warn("Episode stats error:", e);
    }

    document.getElementById("loader").style.display = "none";
    document.getElementById("content").style.display = "block";
    applyFilter();
  } catch (err) {
    document.getElementById("loader").innerHTML = `<div style="font-size:24px;">⚠️</div><div style="margin-top:8px;">មិនអាចផ្ទុកទិន្នន័យបាន: ${err.message}</div>`;
  }
}

function renderGrid(items) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("item-count").textContent = items.length;

  if (items.length === 0) {
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("empty-msg").textContent = currentFilter === "recent" ? "មិនទាន់មានប្រវត្តិទស្សនានៅឡើយទេ" : "រកមិនឃើញភាពយន្តទេ";
    return;
  }
  document.getElementById("empty-state").style.display = "none";

  const watchedHistory = getWatchedHistory();
  const fragment = document.createDocumentFragment();

  items.forEach(show => {
    const card = document.createElement("div");
    const watchedInfo = watchedHistory[show.id];
    const isWatched = !!watchedInfo;

    card.className = `media-card ${isWatched ? 'is-watched' : ''}`;
    
    const isMovie = show.type === "movie";
    const typeLabel = isMovie ? "Movie" : "Series";
    const typeClass = isMovie ? "badge-movie" : "badge-series";
    
    const stats = showEpisodeStats[show.id];
    let epBadgeHtml = "";
    if (isMovie) {
      epBadgeHtml = `<span class="badge-chip badge-hd">FULL</span>`;
    } else if (stats) {
      if (stats.newEpsCount > 1) {
        epBadgeHtml = `<span class="badge-chip badge-ep-count">+x${stats.newEpsCount}</span><span class="badge-chip badge-hd">x${stats.maxEp}</span>`;
      } else {
        epBadgeHtml = `<span class="badge-chip badge-ep-count">x${stats.maxEp || stats.count}</span>`;
      }
    }

    let watchedBadgeHtml = "";
    let lastWatchedSub = "";
    if (isWatched) {
      watchedBadgeHtml = `<span class="badge-chip badge-watched">✓ មើលរួច</span>`;
      if (!isMovie && watchedInfo.lastEp) {
        lastWatchedSub = `<div class="card-last-watched"><span>👁️</span><span>ដល់ភាគ x${watchedInfo.lastEp}</span></div>`;
      } else if (isMovie) {
        lastWatchedSub = `<div class="card-last-watched"><span>👁️</span><span>បានទស្សនា</span></div>`;
      }
    }

    card.innerHTML = `
      <div class="thumb-wrap">
        ${show.poster_url 
          ? `<img class="thumb-img" src="${show.poster_url}" loading="lazy" alt="${show.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` 
          : ''}
        <div class="thumb-placeholder" style="${show.poster_url ? 'display:none' : ''}">🎬</div>
        <div class="overlay-top-left">
          <span class="badge-chip ${typeClass}">${typeLabel}</span>
          ${watchedBadgeHtml}
        </div>
        <div class="overlay-top-right">
          ${epBadgeHtml}
        </div>
        <div class="overlay-bottom">
          <span class="badge-year">${show.release_year || '2026'}</span>
          ${show.status === 'ongoing' ? '<span class="badge-chip badge-new-tag">ONGOING</span>' : ''}
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${show.title}</div>
        ${lastWatchedSub}
      </div>
    `;

    card.addEventListener("click", () => openModal(show));
    fragment.appendChild(card);
  });

  grid.appendChild(fragment);
}

function applyFilter() {
  const searchVal = document.getElementById("search-input").value.trim().toLowerCase();
  let list = allItems;

  const sectionLabel = document.getElementById("section-label");
  const sectionIcon = document.getElementById("section-icon");

  if (currentFilter === "recent") {
    const watchedHistory = getWatchedHistory();
    list = list.filter(s => !!watchedHistory[s.id]);
    list.sort((a, b) => (watchedHistory[b.id]?.timestamp || 0) - (watchedHistory[a.id]?.timestamp || 0));
    sectionLabel.textContent = "ភាពយន្តទើបមើល (Recent Watched)";
    sectionIcon.textContent = "🕒";
  } else if (currentFilter === "movie") {
    list = list.filter(s => s.type === "movie");
    sectionLabel.textContent = "ភាពយន្តទោល (Movies)";
    sectionIcon.textContent = "🎬";
  } else if (currentFilter === "series") {
    list = list.filter(s => s.type !== "movie");
    sectionLabel.textContent = "ភាពយន្តភាគ (Series)";
    sectionIcon.textContent = "📺";
  } else if (currentFilter === "featured") {
    list = list.filter(s => s.featured);
    sectionLabel.textContent = "ភាពយន្តពេញនិយម (Featured)";
    sectionIcon.textContent = "⭐";
  } else {
    sectionLabel.textContent = "ភាពយន្តទាំងអស់";
    sectionIcon.textContent = "🎬";
  }

  if (searchVal) {
    list = list.filter(s => s.title.toLowerCase().includes(searchVal));
  }

  renderGrid(list);
}

// Notification Drawer Open/Close
const notifDrawer = document.getElementById("notif-drawer");
document.getElementById("btn-notif").addEventListener("click", () => {
  notifDrawer.classList.add("active");
  renderNotifications();
});
document.getElementById("btn-close-notif").addEventListener("click", () => {
  notifDrawer.classList.remove("active");
});
notifDrawer.addEventListener("click", (e) => {
  if (e.target === notifDrawer) notifDrawer.classList.remove("active");
});

function renderNotifications() {
  const listEl = document.getElementById("notif-list");
  if (recentUpdatesList.length === 0) {
    listEl.innerHTML = `<div class="state-box"><span>គ្មានការអាប់ដេតថ្មីៗទេ</span></div>`;
    return;
  }

  listEl.innerHTML = "";
  recentUpdatesList.forEach(item => {
    const card = document.createElement("div");
    card.className = "notif-card";
    const isMovie = item.show.type === "movie";
    const epText = isMovie ? "បានបន្ថែមភាពយន្តពេញ" : `បានបញ្ចូលភាគ x${item.episode_number}`;

    card.innerHTML = `
      <img class="notif-thumb" src="${item.show.poster_url || ''}" onerror="this.src=''" alt="">
      <div class="notif-info">
        <div class="notif-show-title">${item.show.title}</div>
        <div class="notif-desc">
          <span>⚡</span>
          <span>${epText}</span>
        </div>
        <div class="notif-time">${timeAgo(item.created_at)}</div>
      </div>
    `;

    card.addEventListener("click", () => {
      notifDrawer.classList.remove("active");
      openModal(item.show);
    });

    listEl.appendChild(card);
  });
}

// Filter tabs
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    applyFilter();
  });
});

// Search handler
document.getElementById("search-input").addEventListener("input", applyFilter);

// Modal Player Logic & Intelligent Fallback
const playerEl = document.getElementById("player");
const fallbackBanner = document.getElementById("fallback-banner");
const retryStreamBtn = document.getElementById("btn-retry-stream");

// Error listener for automatic server fallback
playerEl.addEventListener("error", function(e) {
  console.warn("⚠️ Player encountered error loading stream:", e);
  
  if (!hasTriedFallback && currentEpIdx >= 0 && currentEpisodes[currentEpIdx]) {
    hasTriedFallback = true;
    const ep = currentEpisodes[currentEpIdx];
    const backupItem = backupManifest[ep.id];
    
    fallbackBanner.classList.add("show");
    if (backupItem) {
      document.getElementById("fallback-msg").innerHTML = `⚡ Server ដើមគាំង — មាន Cloud Backup រួចរាល់ (${backupItem.file_size_mb} MB)`;
    } else {
      document.getElementById("fallback-msg").textContent = "⚠️ Server ដើមគាំង — កំពុងប្តូរទៅ Server បម្រុង (Fallback)...";
    }
    showToast("🔄 កំពុងប្តូរទៅកាន់ Server បម្រុង...");

    setTimeout(() => {
      // Retry or switch to alternate backup stream
      const originalUrl = ep.video_url || "";
      let fallbackUrl = originalUrl;
      
      // If original URL contains query params, try clean or mirror
      if (originalUrl.includes("?")) {
        fallbackUrl = originalUrl.split("?")[0];
      }
      
      playerEl.src = fallbackUrl;
      playerEl.load();
      playerEl.play().catch(() => {
        document.getElementById("fallback-msg").textContent = "⚠️ មិនអាចចាក់បានពី Server ដើម — សូមសាកល្បងម្តងទៀត";
      });
    }, 800);
  }
});

retryStreamBtn.addEventListener("click", () => {
  if (currentEpIdx >= 0 && currentEpisodes[currentEpIdx]) {
    hasTriedFallback = false;
    fallbackBanner.classList.remove("show");
    playEpisode(currentEpIdx);
  }
});

async function openModal(show) {
  currentShowObj = show;
  const modal = document.getElementById("modal");
  modal.classList.add("active");
  document.body.style.overflow = "hidden";
  fallbackBanner.classList.remove("show");

  playerEl.src = "";
  playerEl.poster = show.banner_url || show.poster_url || "";

  document.getElementById("m-title").textContent = show.title;
  document.getElementById("m-synopsis").textContent = show.synopsis || "គ្មានព័ត៌មានសង្ខេប / No synopsis.";
  
  const isMovie = show.type === "movie";
  document.getElementById("m-meta").innerHTML = `
    <span class="badge-chip ${isMovie ? 'badge-movie' : 'badge-series'}">${isMovie ? 'ភាពយន្តទោល (Movie)' : 'ភាពយន្តភាគ (Series)'}</span>
    ${show.release_year ? `<span class="badge-chip" style="background:rgba(255,255,255,0.08);color:#cbd5e1;">${show.release_year}</span>` : ''}
    <span class="badge-chip badge-hd">1080p FHD</span>
  `;

  const synBox = document.getElementById("m-synopsis");
  synBox.classList.remove("expanded");
  const synBtn = document.getElementById("m-synopsis-toggle");
  synBtn.textContent = "អានបន្ថែម ›";
  synBtn.onclick = () => {
    synBox.classList.toggle("expanded");
    synBtn.textContent = synBox.classList.contains("expanded") ? "បង្រួមមកវិញ ‹" : "អានបន្ថែម ›";
  };

  const epGrid = document.getElementById("m-episodes-grid");
  epGrid.innerHTML = `<div class="state-box" style="grid-column:1/-1;padding:20px 0;"><div class="spinner"></div><span>កំពុងទាញភាគ...</span></div>`;

  try {
    currentEpisodes = await fetchAPI(`episodes?select=id,title,episode_number,video_url,duration,season&show_id=eq.${show.id}&order=season.asc,episode_number.asc&limit=500`);
    document.getElementById("m-ep-count").textContent = currentEpisodes.length;

    if (currentEpisodes.length === 0) {
      epGrid.innerHTML = `<div class="state-box" style="grid-column:1/-1;padding:20px 0;">មិនទាន់មានភាគសម្រាប់ទស្សនានៅឡើយទេ</div>`;
      return;
    }

    const watchedEpMap = getWatchedEpisodes();
    const watchedHistory = getWatchedHistory();
    const lastWatchedEpNum = watchedHistory[show.id]?.lastEp;

    epGrid.innerHTML = "";
    currentEpisodes.forEach((ep, idx) => {
      const btn = document.createElement("button");
      const hasUrl = !!ep.video_url;
      const epNum = ep.episode_number || (idx + 1);
      const isEpWatched = !!watchedEpMap[show.id + "_" + epNum];
      const isBackedUp = !!backupManifest[ep.id];

      btn.className = `ep-pill ${hasUrl ? '' : 'no-video'} ${isEpWatched ? 'ep-watched' : ''}`;
      btn.textContent = isMovie ? "ទស្សនា (Play)" : (isEpWatched ? `x${epNum} ✓` : `x${epNum}`);
      if (isBackedUp) {
        btn.title = "⚡ Cloud Backup Ready";
      }
      btn.dataset.idx = idx;

      if (hasUrl) {
        btn.addEventListener("click", () => playEpisode(idx));
      }
      epGrid.appendChild(btn);
    });

    let targetIdx = -1;
    if (lastWatchedEpNum) {
      targetIdx = currentEpisodes.findIndex(e => e.episode_number === lastWatchedEpNum && !!e.video_url);
    }
    if (targetIdx === -1) {
      targetIdx = currentEpisodes.findIndex(e => !!e.video_url);
    }
    if (targetIdx !== -1) {
      playEpisode(targetIdx);
    }
  } catch (e) {
    epGrid.innerHTML = `<div style="grid-column:1/-1;color:#f87171;font-size:12px;text-align:center;">មិនអាចផ្ទុកភាគបាន</div>`;
  }
}

function playEpisode(idx) {
  currentEpIdx = idx;
  hasTriedFallback = false;
  fallbackBanner.classList.remove("show");

  const ep = currentEpisodes[idx];
  if (!ep || !ep.video_url) return;

  playerEl.src = ep.video_url;
  playerEl.play().catch(() => {});

  const epNum = ep.episode_number || (idx + 1);

  if (currentShowObj) {
    markEpisodeWatched(currentShowObj.id, epNum, ep.title);
  }

  // Dynamic Telegram Action Buttons (Single or Multi-Part)
  const actionsBar = document.querySelector(".modal-actions-bar");
  if (actionsBar) {
    actionsBar.innerHTML = "";
    const backupItem = backupManifest[ep.id];
    
    if (backupItem && backupItem.telegram_message_id) {
      const cleanChanId = "3943277744"; // Telegram Channel ID (-1003943277744)
      const msgIds = backupItem.telegram_message_ids || [backupItem.telegram_message_id];

      msgIds.forEach((msgId, pIdx) => {
        const tgLink = `https://t.me/c/${cleanChanId}/${msgId}`;
        const btn = document.createElement("a");
        btn.className = "btn-tg-stream";
        btn.href = tgLink;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";

        const partLabel = msgIds.length > 1 
          ? `📥 Part ${pIdx + 1}/${msgIds.length} លើ Telegram`
          : `📥 ទស្សនា / Download លើ Telegram (${backupItem.file_size_mb} MB)`;

        btn.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.05-.49-.83-.27-1.49-.42-1.43-.88.03-.24.38-.49 1.03-.75 4.04-1.76 6.74-2.92 8.09-3.5 3.85-1.65 4.65-1.94 5.18-1.95.12 0 .37.03.54.17.14.12.18.28.2.45-.01.07.01.23 0 .28z"/></svg>
          <span>${partLabel}</span>
        `;

        btn.addEventListener("click", function(e) {
          if (window.Capacitor || window.location.protocol === "file:" || navigator.userAgent.includes("wv")) {
            e.preventDefault();
            window.open(tgLink, "_system");
          }
        });

        actionsBar.appendChild(btn);
      });
    }
  }

  document.querySelectorAll(".ep-pill").forEach(p => p.classList.remove("active"));
  const activeBtn = document.querySelector(`.ep-pill[data-idx="${idx}"]`);
  if (activeBtn) {
    activeBtn.classList.add("active");
    activeBtn.classList.add("ep-watched");
    if (currentShowObj?.type !== "movie") {
      activeBtn.textContent = `x${epNum} ✓`;
    }
  }

  showToast(`▶ កំពុងចាក់: ${ep.title || 'ភាគ ' + epNum}`);
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
  document.body.style.overflow = "";
  playerEl.pause();
  playerEl.src = "";
  fallbackBanner.classList.remove("show");
  const actionsBar = document.querySelector(".modal-actions-bar");
  if (actionsBar) actionsBar.innerHTML = "";
}

document.getElementById("btn-close").addEventListener("click", closeModal);

let toastTimeout;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove("show"), 2800);
}

// Start
init();
</script>
</body>
</html>
