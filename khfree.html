<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>KhFree — មើលរឿង FREE ១០០%</title>
  <meta name="description" content="KhFree - មើលរឿង Free ១០០% ខ្មែរ ដោយមិនបាច់ Login"/>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#07090f;--card:#111828;--card2:#172030;
      --border:rgba(255,255,255,0.07);
      --gold:#d4a017;--gold2:#f0c040;--glow:rgba(212,160,23,0.28);
      --grad:linear-gradient(135deg,#d4a017,#f0c040);
      --txt:#f0f4fc;--muted:#6b7d94;--radius:11px;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:'Kantumruy Pro','Outfit',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:99px}

    header{position:sticky;top:0;z-index:200;background:rgba(7,9,15,0.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:10px 12px 0}
    .nav-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
    .logo{font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
    .tag{font-size:8.5px;font-weight:700;background:rgba(16,185,129,.15);color:#34d399;padding:2px 7px;border-radius:6px;border:1px solid rgba(16,185,129,.28);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
    .sbox{position:relative;flex:1;min-width:0}
    .sbox input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 32px 8px 32px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;transition:.2s}
    .sbox input:focus{background:rgba(255,255,255,.08);border-color:rgba(212,160,23,.45);box-shadow:0 0 0 3px rgba(212,160,23,.1)}
    .sbox input::placeholder{color:#3a4d62;font-size:12px}
    .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#3a4d62;pointer-events:none}
    .sx{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#3a4d62;cursor:pointer;display:none}
    .sx.v{display:block}
    .tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:.16s}
    .tab.on{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 2px 10px var(--glow)}

    main{padding:6px 10px 90px;max-width:1200px;margin:0 auto}
    .sh{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 9px}
    .st{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
    .sc{font-size:10px;color:var(--muted);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:99px}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    @media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
    @media(min-width:680px){.grid{grid-template-columns:repeat(5,1fr);gap:10px}}
    @media(min-width:960px){.grid{grid-template-columns:repeat(6,1fr)}}
    @media(min-width:1200px){.grid{grid-template-columns:repeat(7,1fr)}}

    .card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .18s,box-shadow .18s,border-color .18s}
    .card:hover{transform:translateY(-3px) scale(1.02);border-color:rgba(212,160,23,.35);box-shadow:0 10px 26px rgba(0,0,0,.55)}
    .card:active{transform:scale(.95)}
    .thumb{position:relative;width:100%;aspect-ratio:2/3;background:#0e1726;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .card:hover .thumb img{transform:scale(1.06)}
    .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#131f33,#0b1522)}
    .tl{position:absolute;top:4px;left:4px;z-index:2}
    .tr{position:absolute;top:4px;right:4px;z-index:2}
    .tbot{position:absolute;bottom:0;left:0;right:0;padding:16px 5px 4px;background:linear-gradient(to top,rgba(7,9,15,.97),transparent);z-index:2}
    .bx{font-size:7.5px;font-weight:700;padding:2px 5px;border-radius:3px;backdrop-filter:blur(4px)}
    .bx-m{background:rgba(59,130,246,.8);color:#fff}
    .bx-tv{background:rgba(139,92,246,.8);color:#fff}
    .bx-fr{background:rgba(16,185,129,.85);color:#fff}
    .bx-yr{font-size:8.5px;color:#b0bfcc;font-weight:500}
    .ci{padding:5px 6px 7px}
    .ct{font-size:10.5px;font-weight:600;line-height:1.35;color:#dde6f5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}

    .state{text-align:center;padding:70px 20px;color:var(--muted)}
    .spin{width:24px;height:24px;border:2px solid rgba(212,160,23,.15);border-top-color:var(--gold);border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 12px}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* STATUS BAR */
    .status-bar{font-size:11px;color:var(--muted);text-align:center;padding:6px;background:rgba(212,160,23,.07);border-radius:8px;margin:8px 0;border:1px solid rgba(212,160,23,.15)}
    .status-bar.err{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.2);color:#f87171}
    .status-bar.ok{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.2);color:#34d399}

    /* MODAL */
    #modal{display:none;position:fixed;inset:0;z-index:1000;background:#050810;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #modal.on{display:block}
    .pw{position:relative;background:#000;width:100%}
    .pw iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
    .ploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:5;flex-direction:column;gap:8px}
    .ploading.h{display:none}
    .ploading small{font-size:11px;color:var(--muted)}
    .back{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;z-index:30;background:rgba(5,8,16,.85);border:1px solid rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
    .back:hover{background:rgba(212,160,23,.25);border-color:var(--gold)}
    .mbox{padding:12px 12px 80px;max-width:860px;margin:0 auto}
    .mtit{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:8px}
    .mmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}

    .plabel{font-size:12px;font-weight:700;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .pbts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .pbt{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:11px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px}
    .pbt:hover{background:rgba(255,255,255,.09)}
    .pbt.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.45);color:#34d399}
    .pbt .dot{width:7px;height:7px;border-radius:50%;background:#3a4d62;flex-shrink:0}
    .pbt.on .dot{background:#34d399;box-shadow:0 0 6px #34d399}

    .eplabel{font-size:12px;font-weight:700;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--border);padding-top:14px}
    .epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;margin-bottom:14px}
    .ep{background:var(--card);border:1px solid var(--border);color:var(--txt);padding:6px 3px;border-radius:7px;font-size:10px;font-weight:600;text-align:center;cursor:pointer;transition:.14s}
    .ep:hover{border-color:rgba(212,160,23,.35);background:var(--card2)}
    .ep.on{background:var(--gold);border-color:var(--gold);color:#000}
    .ep.seen:not(.on){border-color:rgba(212,160,23,.4);background:rgba(212,160,23,.07);color:var(--gold2)}

    .note{font-size:11px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:9px 12px;line-height:1.6;margin-bottom:14px}

    .lmw{text-align:center;margin-top:16px}
    .lmb{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.32);color:var(--gold2);font-family:inherit;font-size:12px;font-weight:600;padding:9px 24px;border-radius:99px;cursor:pointer;transition:.2s}
    .lmb:hover{background:rgba(212,160,23,.18)}
    .lmb:disabled{opacity:.4;cursor:not-allowed}

    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:rgba(10,14,26,.96);border:1px solid rgba(212,160,23,.3);padding:8px 17px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff;backdrop-filter:blur(12px);transition:transform .25s;z-index:4000;pointer-events:none;white-space:nowrap}
    #toast.on{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<header>
  <div class="nav-row">
    <div class="logo">KhFree</div>
    <div class="tag">100% FREE</div>
    <div class="sbox">
      <svg class="si" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" type="text" placeholder="ស្វែងរករឿង..." autocomplete="off"/>
      <svg class="sx" id="qx" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="movies">🎬 ដុំ</button>
    <button class="tab" data-t="tvshows">📺 ភាគ</button>
    <button class="tab" data-t="khdub">🇰🇭 ខ្មែរ</button>
    <button class="tab" data-t="free">🆓 Free</button>
    <button class="tab" data-t="korea">🇰🇷 កូរ៉េ</button>
    <button class="tab" data-t="china">🇨🇳 ចិន</button>
    <button class="tab" data-t="japan">🇯🇵 ជប៉ុន</button>
    <button class="tab" data-t="anime">⛩ Anime</button>
    <button class="tab" data-t="history">🕒 ល្ហែ</button>
  </div>
</header>

<main>
  <div id="status" class="status-bar" style="display:none"></div>
  <div id="ldr" class="state"><div class="spin"></div><div style="font-size:12px">ផ្ទុករឿង...</div></div>
  <div id="cnt" style="display:none">
    <div class="sh"><span class="st"><span id="si">🎬</span><span id="sl">រឿង ដុំ</span></span><span class="sc" id="sc">0</span></div>
    <div class="grid" id="grid"></div>
    <div class="lmw" id="lmw" style="display:none"><button class="lmb" id="lmb">ផ្ទុករឿងបន្ថែម ▼</button></div>
  </div>
  <div id="emp" class="state" style="display:none">
    <div style="font-size:30px;margin-bottom:10px">🎬</div>
    <div id="emsg" style="font-size:12.5px"></div>
  </div>
</main>

<!-- MODAL -->
<div id="modal">
  <div class="pw">
    <button class="back" id="bc">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="ploading" id="pl"><div class="spin"></div><small>ផ្ទុក Player...</small></div>
    <iframe id="fr" allowfullscreen allow="autoplay;fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="mbox">
    <div class="mtit" id="mt">—</div>
    <div class="mmeta" id="mm"></div>
    <div class="plabel">▶ ជ្រើស Player</div>
    <div class="pbts" id="pbts"></div>
    <div class="note" id="pnote">
      💡 <b>Player 1</b> ប្រើ khdiamond ផ្ទាល់ (ត្រូវ Login សម្រាប់ Paid).<br>
      ✅ <b>Player 2–4</b> ជា Embed Free ដោយមិនបាច់ Login.<br>
      🔄 ប្ដូរ Player បានតែចុចប៉ុណ្ណោះ!
    </div>
    <div id="ep-sec" style="display:none">
      <div class="eplabel">📋 ជ្រើសភាគ</div>
      <div class="epg" id="epg"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const BASE = 'https://khdiamond.net';
const RSS2JSON = 'https://api.rss2json.com/v1/api.json';
const COUNT = 20;

// RSS Feed URLs for each tab
const FEEDS = {
  movies:  `${BASE}/movies/feed/`,
  tvshows: `${BASE}/tvshows/feed/`,
  khdub:   `${BASE}/genre/khdub/feed/`,
  free:    `${BASE}/genre/%E1%9E%A5%E1%9E%8F%E1%9E%82%E1%9E%B7%E1%9E%8F%E1%9E%90%E1%9F%92%E1%9E%9B%E1%9F%83/feed/`,
  korea:   `${BASE}/genre/%E1%9E%97%E1%9E%B6%E1%9E%82%E1%9E%80%E1%9E%BC%E1%9E%9A%E1%9F%89%E1%9E%BE/feed/`,
  china:   `${BASE}/genre/%E1%9E%97%E1%9E%B6%E1%9E%82-%E1%9E%85%E1%9E%B7%E1%9E%93/feed/`,
  japan:   `${BASE}/genre/%E1%9E%97%E1%9E%B6%E1%9E%82-%E1%9E%87%E1%9E%94%E1%9F%89%E1%9E%BB%E1%9E%93/feed/`,
  anime:   `${BASE}/genre/%E1%9E%97%E1%9E%B6%E1%9E%82-anime/feed/`,
};

const TAB_META = {
  movies:  { icon:'🎬', label:'រឿង ដុំ' },
  tvshows: { icon:'📺', label:'រឿង ភាគ' },
  khdub:   { icon:'🇰🇭', label:'និយាយខ្មែរ' },
  free:    { icon:'🆓', label:'Free ១០០%' },
  korea:   { icon:'🇰🇷', label:'ភាគ កូរ៉េ' },
  china:   { icon:'🇨🇳', label:'ភាគ ចិន' },
  japan:   { icon:'🇯🇵', label:'ភាគ ជប៉ុន' },
  anime:   { icon:'⛩', label:'ភាគ Anime' },
  history: { icon:'🕒', label:'ទើបមើល' },
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let all=[], curTab='movies', loading=false, curItem=null;

// ═══════════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════════
const LS_W = 'khw3'; const LS_H = 'khh3';
function getW(){ try{return JSON.parse(localStorage.getItem(LS_W)||'{}')}catch{return{}} }
function setW(id,ep){ const w=getW(); if(!w[id])w[id]=[]; if(!w[id].includes(ep))w[id].push(ep); localStorage.setItem(LS_W,JSON.stringify(w)) }
function getH(){ try{return JSON.parse(localStorage.getItem(LS_H)||'[]')}catch{return[]} }
function addH(item){ let h=getH().filter(x=>x.link!==item.link); h.unshift({...item,_ts:Date.now()}); h=h.slice(0,60); localStorage.setItem(LS_H,JSON.stringify(h)) }

// ═══════════════════════════════════════════════════════════
//  TOAST / STATUS
// ═══════════════════════════════════════════════════════════
let _tt;
function toast(m,d=2000){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>e.classList.remove('on'),d); }
function setStatus(msg, type=''){
  const s=document.getElementById('status');
  if(!msg){s.style.display='none';return;}
  s.textContent=msg; s.className='status-bar'+(type?' '+type:''); s.style.display='block';
}

// ═══════════════════════════════════════════════════════════
//  RSS2JSON FETCH (no CORS issues!)
// ═══════════════════════════════════════════════════════════
async function fetchRSS(feedUrl, page=1) {
  const offset = (page - 1) * COUNT;
  const url = `${RSS2JSON}?rss_url=${encodeURIComponent(feedUrl)}&count=${COUNT}&offset=${offset}`;
  setStatus(`⏳ ផ្ទុករឿង... (${feedUrl.split('/')[3] || 'feed'})`, '');
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== 'ok') throw new Error(data.message || 'RSS error');
  return data;
}

// ═══════════════════════════════════════════════════════════
//  PARSE RSS ITEM → Movie object
// ═══════════════════════════════════════════════════════════
function parseRSSItem(item) {
  const link = item.link || '';
  // Extract type and slug from URL
  const m = link.match(/khdiamond\.net\/(movies|tvshows)\/([^/?#]+)/);
  const type = m ? m[1] : (link.includes('/tvshows/') ? 'tvshows' : 'movies');
  const slug = m ? m[2] : '';

  // Get poster: thumbnail > enclosure > extract from description img
  let poster = item.thumbnail || item.enclosure?.link || '';
  if (!poster && item.description) {
    const imgM = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (imgM) poster = imgM[1];
  }
  // Ensure https
  if (poster && poster.startsWith('//')) poster = 'https:' + poster;

  // Year from pubDate
  const year = item.pubDate ? new Date(item.pubDate).getFullYear().toString() : '';

  // Clean title (remove HTML tags)
  const title = (item.title || '').replace(/<[^>]+>/g,'').trim();

  return { id: slug, type, slug, title, poster, year, rating: '', link, pubDate: item.pubDate };
}

// ═══════════════════════════════════════════════════════════
//  SEARCH via RSS + local filter
// ═══════════════════════════════════════════════════════════
async function doSearch(q) {
  if (!q.trim()) { loadData(curTab, 1, false); setHead(curTab); return; }
  showLoading();
  try {
    // Try searching via WP JSON search API (public, no CORS needed via rss2json bridge)
    const searchFeed = `${BASE}/?s=${encodeURIComponent(q)}&feed=rss2`;
    const data = await fetchRSS(searchFeed, 1);
    const items = (data.items || []).map(parseRSSItem).filter(x=>x.slug);
    showResult(items, `🔍 "${q}" — ${items.length} លទ្ធផល`, items.length);
    document.getElementById('lmw').style.display = 'none';
    setStatus(items.length > 0 ? `✅ រកឃើញ ${items.length} រឿង` : '⚠️ រកមិនឃើញ', items.length>0?'ok':'err');
  } catch(e) {
    // Fallback: filter already-loaded items
    const r = all.filter(x => x.title.toLowerCase().includes(q.toLowerCase()));
    showResult(r, `🔍 "${q}" — ${r.length} លទ្ធផល`, r.length);
    document.getElementById('lmw').style.display = 'none';
    setStatus(`⚠️ ស្វែងរកក្នុង Cache — ${r.length} លទ្ធផល`,'');
  }
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function mkCard(item) {
  const w = getW(); const seen = w[item.id]?.length > 0;
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `
    <div class="thumb">
      ${item.poster
        ? `<img src="${item.poster}" alt="${item.title}" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML='<div class=ph>🎬</div>'">`
        : '<div class="ph">🎬</div>'}
      <div class="tl"><span class="bx ${item.type==='tvshows'?'bx-tv':'bx-m'}">${item.type==='tvshows'?'ភាគ':'ដុំ'}</span></div>
      <div class="tr">${seen?'<span class="bx bx-fr">✓</span>':''}</div>
      <div class="tbot"><span class="bx-yr">${item.year||''}</span></div>
    </div>
    <div class="ci"><div class="ct">${item.title}</div></div>`;
  c.addEventListener('click', () => openModal(item));
  return c;
}

function showResult(items, label, count) {
  const g = document.getElementById('grid');
  const parts = label.split(' ');
  document.getElementById('si').textContent = parts[0] || '🎬';
  document.getElementById('sl').textContent = parts.slice(1).join(' ');
  document.getElementById('sc').textContent = count;
  document.getElementById('ldr').style.display = 'none';
  if (!items.length) {
    document.getElementById('cnt').style.display = 'none';
    document.getElementById('emp').style.display = 'block';
    document.getElementById('emsg').textContent = 'គ្មានរឿងត្រូវបញ្ជាក់';
    return;
  }
  document.getElementById('cnt').style.display = 'block';
  document.getElementById('emp').style.display = 'none';
  items.forEach(i => g.appendChild(mkCard(i)));
}

function showLoading() {
  document.getElementById('ldr').style.display = 'block';
  document.getElementById('cnt').style.display = 'none';
  document.getElementById('emp').style.display = 'none';
  document.getElementById('grid').innerHTML = '';
  setStatus('');
}

function setHead(tab) {
  const m = TAB_META[tab] || { icon:'🎬', label:tab };
  document.getElementById('si').textContent = m.icon;
  document.getElementById('sl').textContent = m.label;
}

// ═══════════════════════════════════════════════════════════
//  LOAD DATA
// ═══════════════════════════════════════════════════════════
async function loadData(tab, page=1, append=false) {
  if (loading) return; loading = true;
  const lmb = document.getElementById('lmb');

  if (!append) { showLoading(); all = []; }
  else { lmb.disabled = true; lmb.textContent = '⏳ ផ្ទុក...'; }

  try {
    if (tab === 'history') {
      const h = getH();
      all = h;
      document.getElementById('grid').innerHTML = '';
      setHead('history');
      document.getElementById('sc').textContent = h.length;
      if (h.length) { showResult(h, '🕒 ទើបមើល', h.length); }
      else {
        document.getElementById('ldr').style.display = 'none';
        document.getElementById('emp').style.display = 'block';
        document.getElementById('emsg').textContent = 'អ្នកមិនទាន់មើលរឿងណាទេ';
      }
      document.getElementById('lmw').style.display = 'none';
    } else {
      const feedUrl = FEEDS[tab] || FEEDS.movies;
      const data = await fetchRSS(feedUrl, page);
      const items = (data.items || []).map(parseRSSItem).filter(x => x.slug && x.title);
      if (!append) all = items; else all = [...all, ...items];

      document.getElementById('grid').innerHTML = append ? document.getElementById('grid').innerHTML : '';
      if (!append) document.getElementById('grid').innerHTML = '';
      items.forEach(i => document.getElementById('grid').appendChild(mkCard(i)));

      document.getElementById('ldr').style.display = 'none';
      document.getElementById('cnt').style.display = items.length || append ? 'block' : 'none';
      document.getElementById('emp').style.display = !items.length && !append ? 'block' : 'none';
      document.getElementById('emsg').textContent = 'គ្មានរឿង — RSS Feed ទទេ';
      document.getElementById('sc').textContent = all.length;
      // Show load more if we got a full page
      const hasMore = items.length >= COUNT;
      document.getElementById('lmw').style.display = hasMore ? 'block' : 'none';
      lmb.disabled = false; lmb.textContent = 'ផ្ទុករឿងបន្ថែម ▼';
      setStatus(`✅ ផ្ទុក ${all.length} រឿង ${append?'(total)':''}`, 'ok');
      setTimeout(() => setStatus(''), 3000);
    }
  } catch(e) {
    console.error(e);
    document.getElementById('ldr').style.display = 'none';
    document.getElementById('emp').style.display = 'block';
    document.getElementById('emsg').textContent = '⚠️ ផ្ទុក RSS Feed បរាជ័យ — ត្រូវការ Internet';
    setStatus(`❌ ${e.message}`, 'err');
    lmb.disabled = false; lmb.textContent = 'ផ្ទុកម្ដងទៀត';
  }
  loading = false;
  if (append) { const lmb=document.getElementById('lmb'); lmb.disabled=false; }
}

// ═══════════════════════════════════════════════════════════
//  MODAL / PLAYER
// ═══════════════════════════════════════════════════════════
async function openModal(item) {
  curItem = item;
  const modal = document.getElementById('modal');
  const fr = document.getElementById('fr');
  const pl = document.getElementById('pl');

  modal.classList.add('on');
  document.body.style.overflow = 'hidden';
  fr.src = ''; pl.classList.remove('h');

  document.getElementById('mt').textContent = item.title;
  document.getElementById('mm').innerHTML = `
    <span class="bx ${item.type==='tvshows'?'bx-tv':'bx-m'}">${item.type==='tvshows'?'📺 ភាគ':'🎬 ដុំ'}</span>
    ${item.year?`<span class="bx-yr">${item.year}</span>`:''}
    <span class="bx bx-fr">FREE</span>`;

  document.getElementById('ep-sec').style.display = 'none';
  document.getElementById('epg').innerHTML = '';

  // Save history
  addH(item);

  // Build player sources
  buildSources(item, null);

  if (item.type === 'tvshows') {
    // Fetch episode list from RSS
    try {
      toast('⏳ ផ្ទុកភាគ...');
      const epFeed = `${item.link}feed/`;
      // Episodes are separate posts — try fetching show's episode RSS
      // Fallback: show generic numbered pills
      const epData = await fetchRSS(epFeed, 1).catch(() => null);
      if (epData && epData.items && epData.items.length > 0) {
        const eps = epData.items.map((ep, i) => ({
          num: epData.items.length - i,
          title: ep.title?.replace(/<[^>]+>/g,'').trim(),
          url: ep.link
        })).reverse();
        showEpisodes(item, eps);
      } else {
        // Generic numbered episodes (1-50 pills as placeholder)
        const eps = Array.from({length:30},(_,i)=>({num:i+1,title:`ភាគ ${i+1}`,url:item.link}));
        showEpisodes(item, eps);
      }
    } catch { /* ignore */ }
  }
}

function buildSources(item, epUrl) {
  const pbts = document.getElementById('pbts');
  pbts.innerHTML = '';

  const srcUrl = epUrl || item.link;
  const slug = item.slug;
  const isTV = item.type === 'tvshows';

  const sources = [
    { label: 'Player 1 · KhDiamond', url: srcUrl, dot: '#6b7d94' },
    { label: 'Player 2 · VidSrc', url: `https://vidsrc.to/embed/${isTV?'tv':'movie'}/${slug}`, dot: '#34d399' },
    { label: 'Player 3 · 2Embed', url: `https://www.2embed.cc/embed/${slug}`, dot: '#60a5fa' },
    { label: 'Player 4 · EmbedSu', url: `https://embed.su/embed/${isTV?'tv':'movie'}/${slug}`, dot: '#a78bfa' },
  ];

  sources.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'pbt' + (i === 0 ? ' on' : '');
    b.innerHTML = `<span class="dot" style="background:${s.dot}"></span>${s.label}`;
    b.addEventListener('click', () => {
      document.querySelectorAll('.pbt').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      loadPlayer(s.url);
    });
    pbts.appendChild(b);
  });

  // Auto-play first
  loadPlayer(sources[0].url);
}

function showEpisodes(item, eps) {
  const sec = document.getElementById('ep-sec');
  const epg = document.getElementById('epg');
  sec.style.display = 'block';
  epg.innerHTML = '';
  const w = getW();
  eps.forEach(ep => {
    const seen = w[item.id]?.includes(ep.num);
    const pill = document.createElement('button');
    pill.className = 'ep' + (seen ? ' seen' : '');
    pill.textContent = ep.num;
    pill.title = ep.title;
    pill.addEventListener('click', () => {
      document.querySelectorAll('.ep').forEach(x => x.classList.remove('on'));
      pill.classList.add('on', 'seen');
      setW(item.id, ep.num);
      buildSources(item, ep.url);
    });
    epg.appendChild(pill);
  });
  // Auto-click first
  epg.querySelector('.ep')?.click();
}

function loadPlayer(url) {
  const fr = document.getElementById('fr');
  const pl = document.getElementById('pl');
  pl.classList.remove('h');
  fr.src = 'about:blank';
  setTimeout(() => { fr.src = url; }, 60);
  const t = setTimeout(() => pl.classList.add('h'), 7000);
  fr.onload = () => { clearTimeout(t); pl.classList.add('h'); };
}

function closeModal() {
  document.getElementById('modal').classList.remove('on');
  document.getElementById('fr').src = 'about:blank';
  document.body.style.overflow = '';
  curItem = null;
}

// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════
let _curPage = 1;
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    curTab = btn.dataset.t;
    _curPage = 1; all = [];
    document.getElementById('q').value = '';
    document.getElementById('qx').classList.remove('v');
    setHead(curTab);
    document.getElementById('grid').innerHTML = '';
    loadData(curTab, 1, false);
  });
});

const qi = document.getElementById('q'), qx = document.getElementById('qx');
let _sd;
qi.addEventListener('input', e => {
  qx.classList.toggle('v', e.target.value.length > 0);
  clearTimeout(_sd);
  _sd = setTimeout(() => doSearch(e.target.value), 500);
});
qx.addEventListener('click', () => {
  qi.value = ''; qx.classList.remove('v');
  setHead(curTab);
  document.getElementById('grid').innerHTML = '';
  loadData(curTab, 1, false);
});

document.getElementById('bc').addEventListener('click', closeModal);
document.getElementById('lmb').addEventListener('click', () => {
  _curPage++; loadData(curTab, _curPage, true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
setHead('movies');
loadData('movies', 1, false);
</script>
