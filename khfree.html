<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KhFree — មើលរឿង Free ១០០%</title>
  <meta name="description" content="KhFree - មើលរឿង Free ដូចជា KhDiamond ខ្មែរបញ្ចូលសំឡេង ភាពយន្ត ដុំ ភាគ ដោយឥតគិតថ្លៃ" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #07090f;
      --surface: #0d1120;
      --card-bg: #111828;
      --card-hover: #192036;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #d4a017;
      --accent2: #f0c040;
      --accent-glow: rgba(212, 160, 23, 0.3);
      --accent-gradient: linear-gradient(135deg, #d4a017, #f0c040);
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #8898b0;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Kantumruy Pro', 'Outfit', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 15, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: default;
    }
    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-tag {
      font-size: 9px;
      font-weight: 700;
      background: rgba(212, 160, 23, 0.18);
      color: var(--accent2);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(212, 160, 23, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 420px;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 36px 8px 34px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .search-wrap input:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(212,160,23,0.5);
      box-shadow: 0 0 0 3px rgba(212,160,23,0.12);
    }
    .search-wrap input::placeholder { color: #4a5568; font-size: 12.5px; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      cursor: pointer;
      display: none;
      padding: 2px;
    }
    .search-clear.show { display: block; }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    /* ===== MAIN ===== */
    main {
      padding: 8px 10px 90px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 4px 10px;
    }
    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-count {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* Media Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    @media (min-width: 500px) { .media-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
    @media (min-width: 768px) { .media-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }
    @media (min-width: 1024px) { .media-grid { grid-template-columns: repeat(6, 1fr); gap: 14px; } }

    /* Card */
    .media-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
    }
    .media-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(212,160,23,0.35);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,160,23,0.15);
    }
    .media-card:active { transform: scale(0.96); }
    .media-card.is-watched { border-color: rgba(212,160,23,0.5); }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: #182033;
      overflow: hidden;
    }
    .thumb-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .media-card:hover .thumb-img { transform: scale(1.05); }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: linear-gradient(135deg, #182033, #0f1422);
    }

    .overlay-tl {
      position: absolute; top: 5px; left: 5px; z-index: 2;
    }
    .overlay-tr {
      position: absolute; top: 5px; right: 5px; z-index: 2;
    }
    .overlay-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 18px 6px 5px;
      background: linear-gradient(to top, rgba(7,9,15,0.96), transparent);
      z-index: 2;
    }

    .badge {
      font-size: 8.5px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      backdrop-filter: blur(6px);
    }
    .badge-movie { background: rgba(14,165,233,0.85); color: #fff; }
    .badge-tv { background: rgba(139,92,246,0.85); color: #fff; }
    .badge-free { background: rgba(16,185,129,0.9); color: #fff; }
    .badge-year { font-size: 9px; color: #cbd5e1; font-weight: 600; }
    .badge-watched { background: var(--accent-gradient); color: #000; font-weight: 700; box-shadow: 0 2px 8px var(--accent-glow); }

    .card-info { padding: 6px 7px 8px; }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      color: #e8edf5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 29px;
    }
    .card-last {
      font-size: 9px;
      color: var(--accent2);
      font-weight: 600;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Loading / States */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(212,160,23,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MODAL (VIDEO PLAYER) ===== */
    #modal {
      display: none;
      position: fixed; inset: 0; z-index: 1000;
      background: #06080e;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #modal.active { display: block; }

    .player-wrap {
      position: relative;
      width: 100%;
      background: #000;
    }
    .player-wrap iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      display: block;
    }
    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 5;
    }
    .player-loading.hidden { display: none; }

    .modal-nav {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      z-index: 20;
    }
    .btn-back {
      background: rgba(7, 9, 15, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(212,160,23,0.25); border-color: var(--accent); }

    .modal-body {
      padding: 14px 14px 60px;
      max-width: 860px;
      margin: 0 auto;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .modal-source-note {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Episode Pills */
    .episodes-section {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .episodes-header {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
      gap: 6px;
    }
    .ep-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ep-pill:hover { border-color: rgba(212,160,23,0.4); background: var(--card-hover); }
    .ep-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .ep-pill.watched:not(.active) {
      border-color: rgba(212,160,23,0.5);
      background: rgba(212,160,23,0.1);
      color: var(--accent2);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(13, 17, 32, 0.95);
      border: 1px solid rgba(212,160,23,0.3);
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      transition: transform 0.28s ease;
      z-index: 2000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Page indicator */
    .load-more-wrap {
      text-align: center;
      margin-top: 20px;
    }
    .btn-load-more {
      background: rgba(212,160,23,0.1);
      border: 1px solid rgba(212,160,23,0.4);
      color: var(--accent2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-load-more:hover { background: rgba(212,160,23,0.2); }
    .btn-load-more:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Gold shimmer loading placeholder */
    .skeleton {
      background: linear-gradient(90deg, #111828 25%, #1a2238 50%, #111828 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>

      វីដេអូ Embed ដោយផ្ទាល់ពី KhDiamond.net — ឥតគិតថ្លៃ 100%

<div id="toast"></div>

<script>
// ===== CONFIG =====
const BASE_URL = 'https://khdiamond.net';
const CORS_PROXY = 'https://api.allorigins.win/get?url=';
const FREE_GENRE_SLUG = '%E1%9E%A5%E1%9E%8F%E1%9E%82%E1%9E%B7%E1%9E%8F%E1%9E%90%E1%9F%92%E1%9E%9B%E1%9F%83';
const MOVIES_URL = `${BASE_URL}/movies/`;
const TVSHOWS_URL = `${BASE_URL}/tvshows/`;
const FREE_URL = `${BASE_URL}/genre/${FREE_GENRE_SLUG}/`;
const SEARCH_API = `${BASE_URL}/wp-json/dooplay/search/`;
const LS_HISTORY = 'khfree_history';
const LS_WATCHED = 'khfree_watched';
const LS_CACHE = 'khfree_cache_v1';

// ===== STATE =====
let allItems = [];
let filteredItems = [];
let currentFilter = 'free';
let currentPage = 1;
let totalPages = 1;
let isLoading = false;
let searchDebounce;
let currentModal = null;

// ===== LOCAL STORAGE HELPERS =====
function getHistory() { try { return JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); } catch { return []; } }
function getWatched() { try { return JSON.parse(localStorage.getItem(LS_WATCHED) || '{}'); } catch { return {}; } }
function saveHistory(item) {
  let h = getHistory().filter(x => x.url !== item.url);
  h.unshift({ ...item, _ts: Date.now() });
  h = h.slice(0, 50);
  localStorage.setItem(LS_HISTORY, JSON.stringify(h));
}
function markWatched(id, epNum) {
  const w = getWatched();
  if (!w[id]) w[id] = [];
  if (!w[id].includes(epNum)) w[id].push(epNum);
  localStorage.setItem(LS_WATCHED, JSON.stringify(w));
}
function isWatchedEp(id, epNum) {
  const w = getWatched();
  return w[id] && w[id].includes(epNum);
}

// ===== TOAST =====
let toastTimeout;
function toast(msg, duration = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), duration);
}

// ===== CORS PROXY FETCH =====
async function proxyFetch(url) {
  const proxyUrl = CORS_PROXY + encodeURIComponent(url);
  const res = await fetch(proxyUrl);
  if (!res.ok) throw new Error('Fetch failed: ' + res.status);
  const data = await res.json();
  return data.contents;
}

// ===== PARSE HTML from khdiamond =====
function parseItemsFromHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const articles = doc.querySelectorAll('article.item');
  const items = [];
  articles.forEach(art => {
    const id = art.id?.replace('post-', '') || '';
    const type = art.classList.contains('tvshows') ? 'tvshows' : 'movies';
    const link = art.querySelector('a[href]')?.href || '';
    const slugMatch = link.match(/\/(movies|tvshows)\/([^/]+)\//);
    const slug = slugMatch ? slugMatch[2] : '';
    const title = art.querySelector('h3 a, .data h3 a')?.textContent?.trim() || art.querySelector('h3')?.textContent?.trim() || '';
    const poster = art.querySelector('img:not(.img-quality)')?.src || '';
    const year = art.querySelector('.data span')?.textContent?.trim() || '';
    const rating = art.querySelector('.rating')?.textContent?.trim() || '';
    if (title && slug) items.push({ id, type, slug, title, poster, year, rating, link: `${BASE_URL}/${type}/${slug}/` });
  });
  return items;
}

function parsePagesFromHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const lastPage = doc.querySelector('.pagination a:last-child, .pagination span.current');
  // Try to find max page number from pagination
  const allPageLinks = doc.querySelectorAll('.pagination a, .pagination span');
  let maxPage = 1;
  allPageLinks.forEach(el => {
    const n = parseInt(el.textContent.trim());
    if (!isNaN(n) && n > maxPage) maxPage = n;
  });
  return maxPage;
}

// ===== FETCH DATA =====
async function fetchPage(filter, page = 1) {
  let url;
  if (filter === 'movies') url = `${MOVIES_URL}page/${page}/`;
  else if (filter === 'tvshows') url = `${TVSHOWS_URL}page/${page}/`;
  else url = page === 1 ? FREE_URL : `${FREE_URL}page/${page}/`;

  const html = await proxyFetch(url);
  const items = parseItemsFromHTML(html);
  const pages = parsePagesFromHTML(html);
  return { items, pages };
}

async function searchKhDiamond(query) {
  // Use the DooPlay search API via proxy
  const url = `${SEARCH_API}?s=${encodeURIComponent(query)}`;
  try {
    const html = await proxyFetch(url);
    // Search API returns JSON or HTML depending on configuration
    try {
      const json = JSON.parse(html);
      // If JSON array returned
      if (Array.isArray(json)) {
        return json.map(item => ({
          id: String(item.ID || item.id || ''),
          type: item.type || 'movies',
          slug: (item.url || '').replace(/^.*\/(movies|tvshows)\//, '').replace(/\/$/, ''),
          title: item.title || item.post_title || '',
          poster: item.img || item.thumbnail || '',
          year: item.year || '',
          rating: item.rating || '',
          link: item.url || item.permalink || ''
        }));
      }
    } catch { /* not JSON, parse HTML */ }
    return parseItemsFromHTML(html);
  } catch (err) {
    console.warn('Search fallback', err);
    // Fallback: filter already-loaded items
    const q = query.toLowerCase();
    return allItems.filter(i => i.title.toLowerCase().includes(q));
  }
}

// ===== PARSE EPISODE PAGE =====
async function fetchShowPage(item) {
  const html = await proxyFetch(item.link);
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Get episodes list from khdiamond page
  const epLinks = doc.querySelectorAll('#seasons .episodios li, .episodios li');
  const episodes = [];
  epLinks.forEach(li => {
    const a = li.querySelector('a');
    const numEl = li.querySelector('.numerando');
    const imgEl = li.querySelector('img');
    const titleEl = li.querySelector('.episodiotitle a, .episodiotitle');
    if (a) {
      const epUrl = a.href;
      const slugMatch = epUrl.match(/\/episodio\/([^/]+)\//);
      const epSlug = slugMatch ? slugMatch[1] : '';
      const numText = numEl?.textContent?.trim() || '';
      const numMatch = numText.match(/(\d+)/);
      const epNum = numMatch ? parseInt(numMatch[1]) : episodes.length + 1;
      episodes.push({
        num: epNum,
        slug: epSlug,
        url: epUrl,
        title: titleEl?.textContent?.trim() || `ភាគ ${epNum}`,
        thumb: imgEl?.src || item.poster
      });
    }
  });

  // Get post ID from body class or script
  const bodyClass = doc.body?.className || '';
  const postIdMatch = bodyClass.match(/postid-(\d+)/);
  const postId = postIdMatch ? postIdMatch[1] : item.id;

  return { episodes, postId };
}

// ===== RENDER GRID =====
function renderCard(item, isRecentMode = false) {
  const watched = getWatched();
  const hasWatched = watched[item.id] && watched[item.id].length > 0;
  const history = getHistory();
  const histItem = history.find(h => h.url === item.link);
  const lastEp = histItem?.lastEp;

  const card = document.createElement('div');
  card.className = 'media-card' + (hasWatched ? ' is-watched' : '');
  card.dataset.id = item.id;

  card.innerHTML = `
    <div class="thumb-wrap">
      ${item.poster
        ? `<img class="thumb-img" src="${item.poster}" alt="${item.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"thumb-placeholder\\">🎬</div>'">`
        : '<div class="thumb-placeholder">🎬</div>'
      }
      <div class="overlay-tl">
        <span class="badge ${item.type === 'tvshows' ? 'badge-tv' : 'badge-movie'}">${item.type === 'tvshows' ? '📺 ភាគ' : '🎬 ដុំ'}</span>
      </div>
      <div class="overlay-tr">
        ${hasWatched ? '<span class="badge badge-watched">✓ មើលរួច</span>' : '<span class="badge badge-free">FREE</span>'}
      </div>
      <div class="overlay-bottom">
        <span class="badge-year">${item.year || ''}</span>
        ${item.rating && parseFloat(item.rating) > 0 ? `<span class="badge" style="background:rgba(0,0,0,0.7);color:#fbbf24;">⭐${parseFloat(item.rating).toFixed(1)}</span>` : ''}
      </div>
    </div>
    <div class="card-info">
      <div class="card-title">${item.title}</div>
      ${lastEp ? `<div class="card-last">▶ ភាគ ${lastEp}</div>` : ''}
    </div>
  `;

  card.addEventListener('click', () => openModal(item));
  return card;
}

function renderGrid(items) {
  const grid = document.getElementById('grid');
  const isRecentMode = currentFilter === 'recent';
  items.forEach(item => grid.appendChild(renderCard(item, isRecentMode)));
  document.getElementById('item-count').textContent = filteredItems.length + (totalPages > currentPage ? '+' : '');
}

function clearGrid() {
  document.getElementById('grid').innerHTML = '';
}

// ===== MODAL =====
async function openModal(item) {
  const modal = document.getElementById('modal');
  const frame = document.getElementById('player-frame');
  const playerLoading = document.getElementById('player-loading');
  const titleEl = document.getElementById('modal-title');
  const metaEl = document.getElementById('modal-meta');
  const epSection = document.getElementById('episodes-section');
  const epGrid = document.getElementById('ep-grid');

  currentModal = item;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  frame.src = '';
  playerLoading.classList.remove('hidden');
  titleEl.textContent = item.title;
  metaEl.innerHTML = `
    <span class="badge ${item.type === 'tvshows' ? 'badge-tv' : 'badge-movie'}">${item.type === 'tvshows' ? '📺 រឿង ភាគ' : '🎬 រឿង ដុំ'}</span>
    ${item.year ? `<span class="badge badge-year">${item.year}</span>` : ''}
    ${item.rating && parseFloat(item.rating) > 0 ? `<span class="badge" style="background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3);">⭐ ${parseFloat(item.rating).toFixed(1)}</span>` : ''}
    <span class="badge badge-free">FREE</span>
  `;
  epSection.style.display = 'none';
  epGrid.innerHTML = '';

  if (item.type === 'movies') {
    // Movie: Load embed directly
    loadPlayerEmbed(item.link, item.id, 1);
    saveHistory({ url: item.link, title: item.title, poster: item.poster, lastEp: null });
  } else {
    // TV Show: Fetch episodes list
    try {
      toast('⏳ កំពុងផ្ទុកបញ្ជីភាគ...');
      const { episodes, postId } = await fetchShowPage(item);
      if (episodes.length > 0) {
        epSection.style.display = 'block';
        episodes.forEach(ep => {
          const pill = document.createElement('button');
          pill.className = 'ep-pill' + (isWatchedEp(item.id, ep.num) ? ' watched' : '');
          pill.textContent = `ភាគ ${ep.num}`;
          pill.addEventListener('click', () => {
            document.querySelectorAll('.ep-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active', 'watched');
            loadPlayerEmbed(ep.url, item.id, ep.num);
            markWatched(item.id, ep.num);
            saveHistory({ url: item.link, title: item.title, poster: item.poster, lastEp: ep.num });
          });
          epGrid.appendChild(pill);
        });
        // Auto-play last watched ep or ep 1
        const history = getHistory().find(h => h.url === item.link);
        const startEp = history?.lastEp || 1;
        const startPill = [...epGrid.querySelectorAll('.ep-pill')].find((_, i) => episodes[i]?.num === startEp) || epGrid.querySelector('.ep-pill');
        if (startPill) startPill.click();
      } else {
        // No episodes found, load the show page directly
        loadPlayerEmbed(item.link, item.id, 1);
      }
    } catch (err) {
      console.warn('Failed to load episodes', err);
      loadPlayerEmbed(item.link, item.id, 1);
    }
  }
}

function loadPlayerEmbed(url, itemId, epNum) {
  const frame = document.getElementById('player-frame');
  const playerLoading = document.getElementById('player-loading');
  playerLoading.classList.remove('hidden');

  // Use khdiamond page directly in iframe (it has their video player)
  frame.src = url;
  frame.onload = () => playerLoading.classList.add('hidden');
  setTimeout(() => playerLoading.classList.add('hidden'), 5000); // fallback
}

function closeModal() {
  const modal = document.getElementById('modal');
  const frame = document.getElementById('player-frame');
  modal.classList.remove('active');
  document.body.style.overflow = '';
  frame.src = '';
  currentModal = null;
}

document.getElementById('btn-close').addEventListener('click', closeModal);

// ===== LOAD DATA =====
async function loadData(filter, page = 1, append = false) {
  if (isLoading) return;
  isLoading = true;

  const loader = document.getElementById('loader');
  const content = document.getElementById('content');
  const emptyState = document.getElementById('empty-state');
  const btnMore = document.getElementById('btn-load-more');
  const loadMoreWrap = document.getElementById('load-more-wrap');

  if (!append) {
    loader.style.display = 'block';
    content.style.display = 'none';
    emptyState.style.display = 'none';
    clearGrid();
  } else {
    if (btnMore) btnMore.disabled = true;
    if (btnMore) btnMore.textContent = '⏳ កំពុងផ្ទុក...';
  }

  try {
    let items = [];
    let pages = 1;

    if (filter === 'recent') {
      const history = getHistory();
      items = history.map(h => ({
        id: h.id || '',
        type: h.type || 'movies',
        slug: h.slug || '',
        title: h.title,
        poster: h.poster,
        year: h.year || '',
        rating: h.rating || '',
        link: h.url,
        lastEp: h.lastEp
      }));
      pages = 1;
    } else {
      const result = await fetchPage(filter, page);
      items = result.items;
      pages = result.pages;
    }

    if (page === 1 && !append) {
      allItems = items;
    } else {
      allItems = [...allItems, ...items];
    }

    filteredItems = allItems;
    totalPages = pages;
    currentPage = page;

    loader.style.display = 'none';

    if (filteredItems.length === 0) {
      emptyState.style.display = 'block';
      document.getElementById('empty-msg').textContent = filter === 'recent' ? 'អ្នកមិនទាន់មើលរឿងណាទេ' : 'គ្មានរឿង Free ឥឡូវ';
    } else {
      content.style.display = 'block';
      if (!append) clearGrid();
      renderGrid(append ? items : filteredItems);
    }

    // Load more button
    if (totalPages > currentPage && filter !== 'recent') {
      loadMoreWrap.style.display = 'block';
      if (btnMore) { btnMore.disabled = false; btnMore.textContent = 'ផ្ទុករឿងបន្ថែម ▼'; }
    } else {
      loadMoreWrap.style.display = 'none';
    }

  } catch (err) {
    console.error('Load error:', err);
    loader.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('empty-msg').textContent = '⚠️ ផ្ទុកទិន្នន័យមិនបាន — សូមព្យាយាមម្តងទៀត';
    if (btnMore) { btnMore.disabled = false; btnMore.textContent = 'ផ្ទុកម្តងទៀត'; }
  }

  isLoading = false;
}

// ===== SEARCH =====
async function performSearch(query) {
  if (!query.trim()) {
    // Reset to current filter
    loadData(currentFilter, 1, false);
    updateSectionHead(currentFilter);
    return;
  }

  const loader = document.getElementById('loader');
  const content = document.getElementById('content');
  const emptyState = document.getElementById('empty-state');
  loader.style.display = 'block';
  content.style.display = 'none';
  emptyState.style.display = 'none';
  clearGrid();
  document.getElementById('load-more-wrap').style.display = 'none';

  try {
    const results = await searchKhDiamond(query);
    loader.style.display = 'none';
    filteredItems = results;
    document.getElementById('section-icon').textContent = '🔍';
    document.getElementById('section-label').textContent = `លទ្ធផលស្វែងរក "${query}"`;
    document.getElementById('item-count').textContent = results.length;

    if (results.length === 0) {
      emptyState.style.display = 'block';
      document.getElementById('empty-msg').textContent = `រកមិនឃើញ "${query}"`;
    } else {
      content.style.display = 'block';
      renderGrid(results);
    }
  } catch (err) {
    loader.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('empty-msg').textContent = 'ស្វែងរកបរាជ័យ — ព្យាយាមម្តងទៀត';
  }
}

// ===== SECTION LABELS =====
function updateSectionHead(filter) {
  const icons = { free: '🆓', recent: '🕒', movies: '🎬', tvshows: '📺' };
  const labels = { free: 'រឿង Free ទាំងអស់', recent: 'ទើបមើល (Recent)', movies: 'រឿង ដុំ', tvshows: 'រឿង ភាគ' };
  document.getElementById('section-icon').textContent = icons[filter] || '🎬';
  document.getElementById('section-label').textContent = labels[filter] || '';
}

// ===== EVENT LISTENERS =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    allItems = [];
    currentPage = 1;
    updateSectionHead(currentFilter);
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('show');
    loadData(currentFilter, 1, false);
  });
});

const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', (e) => {
  const q = e.target.value;
  searchClear.classList.toggle('show', q.length > 0);
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => performSearch(q), 500);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  performSearch('');
});

document.getElementById('btn-load-more').addEventListener('click', () => {
  loadData(currentFilter, currentPage + 1, true);
});

// Back button / keyboard
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ===== INIT =====
updateSectionHead('free');
loadData('free', 1, false);
</script>
