name: Auto Backup to Telegram

on:
  schedule:
    # Runs automatically every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write # Allows committing the updated manifest back to repository

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backup Script
        env:
          PYTHONUNBUFFERED: "1"
          MAX_RUN_SECONDS: "3000" # 50 minutes time guard
          MAX_BATCH: "60"
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          python backup_to_telegram.py

      - name: Commit & Push Backup Manifest
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backup_manifest.json
          git diff --staged --quiet || (git commit -m "chore: auto-update backup manifest [skip ci]" && git pull --rebase origin main && git push origin main)
