name: Update KhFree Data

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger
  push:
    paths:
      - 'scrape_kh.py'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: |
          echo "Starting KhFree scraper..."
          python scrape_kh.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check output
        run: |
          if [ -f kh_data.json ]; then
            echo "✅ kh_data.json exists"
            wc -c kh_data.json
            python -c "import json; d=json.load(open('kh_data.json')); print('Tabs:', list(d['tabs'].keys())); print('Total items:', sum(len(v) for v in d['tabs'].values()))"
          else
            echo "❌ kh_data.json NOT found!"
            exit 1
          fi

      - name: Commit & push kh_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kh_data.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: update kh_data.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
